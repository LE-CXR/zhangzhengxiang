/* 快讯语气：上涨的板块要配「利好」类快讯，下跌的板块要配「利空」类快讯。
   语气相反的（比如跌的票配一条「上调目标价」）不许当原因，宁可说没有。 */
var TONE_UP = ["上涨","大涨","涨停","创新高","新高","走高","回升","反弹","利好","超预期","好于预期",
  "增长","预增","扭亏","中标","订单","签约","中标","合作","获批","量产","交付","扩张","扩产","提价",
  "涨价","回购","增持","上调","提高目标价","降息","降准","补贴","突破","放量"];
var TONE_DOWN = ["下跌","大跌","跌停","创新低","新低","走低","回落","跳水","重挫","利空","不及预期",
  "差于预期","下滑","下降","预减","亏损","裁员","减产","停产","减持","调查","处罚","罚款","退市","问询",
  "立案","下调","降低目标价","加息","关税","制裁","出口管制","实体清单","召回","放缓","承压","重罚",
  "砍单","抛售"];
function toneOf(t){
  var cu = 0, cd = 0, i;
  for(i = 0; i < TONE_UP.length; i++){ if(t.indexOf(TONE_UP[i]) >= 0) cu++; }
  for(i = 0; i < TONE_DOWN.length; i++){ if(t.indexOf(TONE_DOWN[i]) >= 0) cd++; }
  return cu > cd ? 1 : (cd > cu ? -1 : 0);
}
function tuneHead(t, want){ var v = toneOf(t); return v === 0 || v === want; }

function pickReason(item, all, news, used){
  var pool = item.pool, alias = aliasList(pool), ths = themesOf(pool.tx);
  var poolNames = [];
  (all || []).forEach(function(o){ if(poolNames.indexOf(o.pool.name) < 0) poolNames.push(o.pool.name); });
  var named = null, themed = null;
  news.forEach(function(n){
    var t = String(n.t || ""), i;
    if(used && used[t]) return;                 /* 同一条快讯不重复引用 */
    var sig = 0;
    for(i=0;i<SIGNAL.length;i++){ if(t.indexOf(SIGNAL[i]) >= 0){ sig = 1; break; } }
    var other = 0;
    for(i=0;i<poolNames.length;i++){ if(t.indexOf(poolNames[i]) >= 0){ other = 1; break; } }
    /* 1) 标题直接点名这只票（有动作词的优先） */
    for(i=0;i<alias.length;i++){
      if(t.indexOf(alias[i]) >= 0){
        var s1 = 100 + alias[i].length + (sig ? 8 : 0);
        if(!named || s1 > named.score) named = {score: s1, kind: "direct", kw: alias[i], n: n};
        return;
      }
    }
    /* 2) 板块关键词命中：取最长命中词，并要求「够具体」——
          长度 >=4 才算分、含动作词 +6、标题里出现池内公司名 +5；低于 7 分不当作原因 */
    for(var j=0;j<ths.length;j++){
      var kws = ths[j].k, hit = "";
      for(var k=0;k<kws.length;k++){
        if(t.indexOf(kws[k]) >= 0 && kws[k].length > hit.length) hit = kws[k];
      }
      if(hit){
        var sc = hit.length + (sig ? 6 : 0) + (other ? 5 : 0);
        /* 命中词越长越可信；两三个字的行业词必须再配上「动作」或池内公司名 */
        var ok = (hit.length >= 4 && sc >= 7) || (hit.length === 3 && sig) || (hit.length <= 2 && sig && other);
        if(ok && (!themed || sc > themed.score)){
          themed = {score: sc, kind: "theme", kw: hit, th: ths[j].n, n: n};
        }
        return;
      }
    }
  });
  if(named) return named;
  if(themed) return themed;
  return sectorReason(item, all, ths);
}
/* 没有快讯时只能说板块联动：同主题、同方向、幅度靠前的兄弟 */
function sectorReason(item, all, ths){
  var peers = [];
  if(ths.length){
    var set = ths[0].tx;
    all.forEach(function(o){
      if(o.pool.tx === item.pool.tx) return;
      if(set.indexOf(o.pool.tx) < 0) return;
      if(o.isUp !== item.isUp) return;
      peers.push(o);
    });
    peers.sort(function(a,b){ return Math.abs(b.q.pct) - Math.abs(a.q.pct); });
  }
  return {score: 0, kind: "sector", peers: peers.slice(0,3), th: ths.length ? ths[0].n : ""};
}
/* 同方向里按板块聚组：至少 2 只同主题才算一条「线」，组间按组内最强幅度排序 */
function themeGroups(items){
  var gs = [];
  items.forEach(function(it){
    var k = topicOf(it);
    if(!k) return;
    var g = null, i;
    for(i = 0; i < gs.length; i++){ if(gs[i].n === k){ g = gs[i]; break; } }
    if(!g){ g = {n:k, items:[]}; gs.push(g); }
    g.items.push(it);
  });
  gs = gs.filter(function(g){ return g.items.length >= 2; });
  gs.forEach(function(g){
    g.items.sort(function(a,b){ return Math.abs(b.q.pct) - Math.abs(a.q.pct); });
    g.lead = Math.abs(g.items[0].q.pct);
  });
  gs.sort(function(a,b){ return b.lead - a.lead; });
  return gs;
}
function pctSpan(it, tc){
  var c = it.isUp ? tc.up : tc.down;
  return '<span style="color:' + c + '">' + fmtPct(it.q.pct) + '</span>';
}
/* 在一条板块线里挑一条能当原因的快讯：直接点名优先，其次板块关键词；
   语气和涨跌方向相反的（跌的线配「上调目标价」）一律不要 */
function pickCite(g, want, all, news, used){
  var best = null;
  g.items.forEach(function(it){
    var r = pickReason(it, all, news, used);
    if(!r || (r.kind !== "direct" && r.kind !== "theme")) return;
    var t = String(r.n.t || "");
    if(!tuneHead(t, want)) return;
    var rank = (r.kind === "direct" ? 20 : 10) + (toneOf(t) === want ? 3 : 0);
    if(!best || rank > best.rank) best = {r: r, it: it, rank: rank};
  });
  return best;
}
/* 一条板块线：板块名 + 组内幅度靠前的几只 + 能对上的那条快讯（对不上就明说） */
function groupLineHtml(g, dir, tc, all, news, used, bag, shown){
  var want = dir === "领涨" ? 1 : -1;
  var c0 = pickCite(g, want, all, news, used);
  var cite = c0 ? c0.r : null, citeItem = c0 ? c0.it : null;
  var mem = g.items.slice(0, 3);
  if(citeItem && mem.indexOf(citeItem) < 0) mem = mem.slice(0, 2).concat([citeItem]);
  var who = mem.map(function(it){
    shown[it.pool.tx] = 1;
    return esc(it.pool.name) + " " + pctSpan(it, tc);
  }).join("、");
  var tail;
  if(cite){
    bag.push(cite);
    if(used) used[String(cite.n.t || "")] = 1;
    tail = '<i class="logic-kw">「' + esc(String(cite.n.t).slice(0, 34)) + '」</i><em>'
      + esc(newsClock(cite.n).slice(5, 16)) + (cite.kind === "direct" ? " · 直接点名" : " · " + esc(cite.kw)) + '</em>';
  } else {
    tail = '<span class="logic-none">今天没有对得上的快讯，属于板块自己' + (dir === "领涨" ? "走强" : "走弱") + '。</span>';
  }
  return '<div class="logic-line"><span class="logic-k">' + dir + '</span>'
    + '<b class="logic-topic">' + esc(g.n) + '</b> ' + who + ' ' + tail + '</div>';
}
/* 一个方向凑不出板块（只有单只）时，单看这一只自己：有快讯就引，没有就说没有 */
function soloLineHtml(item, dir, all, news, tc, bag, used, shown){
  var want = item.isUp ? 1 : -1;
  var r = pickReason(item, all, news, used);
  if((r.kind === "direct" || r.kind === "theme") && !tuneHead(String(r.n.t || ""), want)){
    r = sectorReason(item, all, themesOf(item.pool.tx));
  }
  shown[item.pool.tx] = 1;
  var head = '<span class="logic-k">' + dir + '</span><b>' + esc(item.pool.name) + '</b> ' + pctSpan(item, tc) + ' ';
  var body;
  if(r.kind === "direct" || r.kind === "theme"){
    bag.push(r);
    if(used) used[String(r.n.t || "")] = 1;
    body = (r.kind === "direct" ? "被快讯点名：" : "同板块线索（" + esc(r.th) + " · " + esc(r.kw) + "）：")
      + '<i class="logic-kw">「' + esc(String(r.n.t).slice(0, 34)) + '」</i><em>'
      + esc(newsClock(r.n).slice(5, 16)) + '</em>';
  } else if(r.peers && r.peers.length){
    body = '<span class="logic-none">没有对得上的快讯，同板块同向的是 '
      + r.peers.map(function(p){ return esc(p.pool.name) + " " + fmtPct(p.q.pct); }).join("、") + '。</span>';
  } else {
    body = '<span class="logic-none">没有对得上的快讯，也没看出板块联动，更像个股自己的事。</span>';
  }
  return '<div class="logic-line">' + head + body + '</div>';
}
function renderLogic(){
  var box = document.getElementById("mktLogic");
  if(!box) return;
  if(!logicState){ box.innerHTML = ""; return; }
  var st = logicState, tc = themeColors();
  var news = logicNewsPool();
  var bag = [], used = {}, shown = {};
  var upG = themeGroups(st.ups), downG = themeGroups(st.downs);
  var upLine = upG.length
    ? groupLineHtml(upG[0], "领涨", tc, st.all, news, used, bag, shown)
    : st.ups.slice(0, 2).map(function(it){ return soloLineHtml(it, "领涨", st.all, news, tc, bag, used, shown); }).join("");
  var downLine = downG.length
    ? groupLineHtml(downG[0], "领跌", tc, st.all, news, used, bag, shown)
    : st.downs.slice(0, 2).map(function(it){ return soloLineHtml(it, "领跌", st.all, news, tc, bag, used, shown); }).join("");
  /* 点名：被快讯直接点名、且没在上面出现过的个股（最多 2 条） */
  var named = [];
  st.ups.concat(st.downs).forEach(function(it){
    if(named.length >= 2 || shown[it.pool.tx]) return;
    var r = pickReason(it, st.all, news, used);
    if(r && r.kind === "direct" && tuneHead(String(r.n.t || ""), it.isUp ? 1 : -1)){
      bag.push(r);
      if(used) used[String(r.n.t || "")] = 1;
      named.push('<div class="logic-line"><span class="logic-k">点名</span><b>' + esc(it.pool.name) + '</b> '
        + pctSpan(it, tc) + ' <i class="logic-kw">「' + esc(String(r.n.t).slice(0, 34)) + '」</i><em>'
        + esc(newsClock(r.n).slice(5, 16)) + ' · 快讯点名</em></div>');
    }
  });
  /* 大盘 */
  var idx = st.idx.filter(function(i){ return i && i.q && isFinite(i.q.pct); });
  var upN = idx.filter(function(i){ return i.isUp; }).length;
  var tone = idx.length
    ? idx.slice(0, 4).map(function(i){ return esc(i.pool.name) + " " + pctSpan(i, tc); }).join("、")
      + (upN === idx.length ? "（全线走高）" : upN === 0 ? "（全线走低）" : "（涨跌分化）")
    : '<span class="logic-none">指数数据还没到。</span>';
  /* 看点：领涨、领跌分别压在哪条线上 */
  var upTop = upG.length ? upG[0].n : (st.ups[0] ? topicOf(st.ups[0]) : "");
  var downTop = downG.length ? downG[0].n : (st.downs[0] ? topicOf(st.downs[0]) : "");
  var view = "";
  if(upLine && downLine && upTop && downTop){
    if(upTop !== downTop){
      view = '今天的钱在两条线之间换手：一头是 <b>' + esc(upTop) + '</b>，另一头是 <b>' + esc(downTop) + '</b>。';
    } else {
      view = '涨跌都压在 <b>' + esc(upTop) + '</b> 这条线上，板块内部在分化，主要看个股自己的消息面。';
    }
  }
  /* 收起时的一行摘要：大盘什么调子 · 领涨哪条线 · 领跌哪条线 */
  var mood = idx.length
    ? (upN === idx.length ? "全线走高" : upN === 0 ? "全线走低" : "涨跌分化")
    : "指数还没到";
  var upName = upTop || (st.ups[0] ? st.ups[0].pool.name : "");
  var downName = downTop || (st.downs[0] ? st.downs[0].pool.name : "");
  var brief = '<span class="logic-k">大盘</span>' + mood
    + ' · <span class="logic-k">领涨</span><span style="color:' + tc.up + '">' + esc(upName ? shortTopic(upName) : "--") + '</span>'
    + ' · <span class="logic-k">领跌</span><span style="color:' + tc.down + '">' + esc(downName ? shortTopic(downName) : "--") + '</span>';

  var subTxt = news.length
    ? "对照最近 60 小时 " + news.length + " 条快讯 · 池内 " + st.ups.length + " 涨 / " + st.downs.length + " 跌"
    : "快讯还没到，先看板块联动";
  var html = '<div class="logic-hd"><b>今日逻辑</b>'
    + '<button class="logic-toggle" id="logicToggle"><span class="logic-caret">›</span> <span class="logic-tg-t">展开</span></button></div>';
  html += '<div class="logic-brief" id="logicBrief">' + brief + '</div>';
  html += '<div class="logic-body" id="logicBody" hidden><div class="logic-sub">' + subTxt + '</div>';
  html += '<div class="logic-line"><span class="logic-k">大盘</span>' + tone + '</div>';
  html += upLine + downLine;
  html += named.join("");
  if(view) html += '<div class="logic-line"><span class="logic-k">看点</span>' + view + '</div>';
  if(bag.length){
    html += '<div class="logic-more" id="logicMore">展开 ' + bag.length + ' 条依据 <span class="logic-caret">›</span></div>';
    html += '<div class="logic-quotes" id="logicQuotes" hidden>' + bag.map(function(r){
      return '<button class="logic-quote" data-url="' + esc(r.n.url) + '" data-t="' + esc(r.n.t) + '" data-f="' + esc(r.n.full || "") + '">'
        + '<span class="logic-quote-t">' + esc(r.n.t) + '</span>'
        + '<span class="logic-quote-m">' + esc(newsClock(r.n).slice(5, 16)) + ' · '
        + (r.kind === "direct" ? "点名" : esc(r.th || "板块")) + '</span></button>';
    }).join("") + '</div>';
  }
  html += '<div class="logic-foot">依据 = 快讯原文 + 同板块联动，不是定论；点标题看原文。</div></div>';
  box.innerHTML = html;
  /* 收起/展开：状态记住，下次进来还是上次那样 */
  var body = document.getElementById("logicBody"), tg = document.getElementById("logicToggle"), bf = document.getElementById("logicBrief");
  var open = false;
  try{ open = localStorage.getItem("urokLogicOpen") === "1"; }catch(e){}
  function setOpen(v){
    if(!body) return;
    body.hidden = !v;
    if(tg){
      tg.classList.toggle("on", v);
      var lab = tg.querySelector(".logic-tg-t");
      if(lab) lab.textContent = v ? "收起" : "展开";
    }
    try{ localStorage.setItem("urokLogicOpen", v ? "1" : "0"); }catch(e){}
  }
  setOpen(open);
  [tg, bf].forEach(function(el){
    if(el) el.addEventListener("click", function(){ setOpen(!!body && body.hidden); });
  });
  var more = document.getElementById("logicMore"), qs = document.getElementById("logicQuotes");
  if(more && qs){
    more.addEventListener("click", function(){
      qs.hidden = !qs.hidden;
      more.classList.toggle("on", !qs.hidden);
    });
    qs.addEventListener("click", function(e){
      var b = e.target.closest(".logic-quote");
      if(b) openNewsReader(b.dataset.url || "", b.dataset.t || "", b.dataset.f || "");
    });
  }
}

function emLoad(col){
  return new Promise(function(resolve){
    try{ delete window.ajax; }catch(e){}
    const s = document.createElement("script");
    s.referrerPolicy = "no-referrer";
    s.src = "https://newsapi.eastmoney.com/kuaixun/v1/getlist_" + col + "_ajax_50_1_.html";
    let done = false;
    const finish = ()=>{
      if(done) return; done = true;
      const raw = (window.ajax && window.ajax.LivesList) || [];
      try{ delete window.ajax; }catch(e){}
      try{ s.remove(); }catch(e){}
      resolve(raw);
    };
    s.onload = finish;
    s.onerror = finish;
    setTimeout(finish, 8000);
    document.head.appendChild(s);
  });
}
function fetchEMNews(){

  (async function(){
    for(let i=0;i<cols.length;i++){
      const raw = await emLoad(cols[i][1]);
      const items = raw.map(it=>({
        t: it.title || "",
        tag: it.simtype_zh || "快讯",
        time: it.showtime || it.ordertime || "",
        url: (it.url_w || it.url_m || "").replace(/^http:/, "https:"),
        full: (it.digest || "").trim() || "",
        cat: cols[i][0]
      })).filter(i=>i.t && i.url).slice(0, 40);
      if(items.length){ newsRendered = true; addNews(items); }
    }
    if(!newsRendered) failNews();
  })();
}

  function writeC(a){ try{ localStorage.setItem("planChipsV1", JSON.stringify(a)); }catch(e){} }
  function repaint(){ try{ if(typeof renderToday === "function") renderToday(); }catch(e){} }
  function say(t){ try{ if(typeof toast === "function") toast(t); }catch(e){} }
  function enc(s){ try{ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }catch(e){ return ""; } }
  function dec(s){ try{ var t=String(s).replace(/-/g,"+").replace(/_/g,"/"); while(t.length%4){ t+="="; } return decodeURIComponent(escape(atob(t))); }catch(e){ return ""; } }  function gather(){
    var o={v:1,t:Date.now(),plan:readP()};
    var c=readC();
    if(c && c.length && !isDefaultChips(c)) o.chips=c;
    o.rep = readRepC();
    ["fix","prev","bg"].forEach(function(k){ if(extra[k] !== undefined) o[k] = extra[k]; });
    return o;
  }
  function mkCode(){ return "U1"+enc(JSON.stringify(gather())); }
  function parse(c){ var s=String(c||""); if(s.indexOf("U1")===0) s=s.slice(2); var t=dec(s); if(!t) return null; try{ return JSON.parse(t); }catch(e){ return null; } }
  function applyCode(c){
    var o = parse(c); if(!o) return false;
    keepExtra(o);
    if(Array.isArray(o.chips) && o.chips.length){
      var curC = readC();
      if(!(isDefaultChips(o.chips) && curC && curC.length && !isDefaultChips(curC))) writeC(o.chips.map(String));
    }
    if(Array.isArray(o.rep)) writeRepC(o.rep);
    if(o.plan && typeof o.plan === "object"){
      var p = readP();
      Object.keys(o.plan).forEach(function(k){ if(Array.isArray(o.plan[k])) p[k]=o.plan[k]; });
      writeP(p);
    }
    repaint();
    return true;
  }
  function fmt(ts){ if(!ts) return "--"; var d=new Date(ts); function p(n){ return (n<10?"0":"")+n; }
    return (d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
  function setState(txt, cls){
    var s=el("csState"), d=el("csDot");
    if(s){ s.textContent=txt; s.className="cs-state"+(cls?" "+cls:""); }
    if(d){ d.className="cs-dot"+(cls?" "+cls:""); }
  }
  function note(t){ var n=el("csNote"); if(n) n.textContent=t; }
  function msg(t, err){ var m=el("csMsg"); if(m){ m.textContent=t||""; m.className="cs-msg"+(err?" err":""); } }
  function apiUrl(){ return CLOUD_BASE + "/api/sync"; }
  function pull(){
    return fetch(apiUrl()+"?room="+encodeURIComponent(room)+"&n="+Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(j){ if(!j || !j.ok) throw new Error("bad"); return j; });
  }
  function send(p, beacon){
    var body = JSON.stringify(p);
    if(beacon && navigator.sendBeacon){
      try{ return Promise.resolve(navigator.sendBeacon(apiUrl(), new Blob([body], {type:"application/json"}))); }catch(e){}
    }
    return fetch(apiUrl(), {method:"POST", cache:"no-store", headers:{"Content-Type":"application/json"}, body:body})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
  }
  function mark(c, t){ lastPushed=c; localT=t; lsSet(LAST_KEY,c); lsSet(T_KEY,String(t)); lsSet(DIRTY_KEY,"0"); dirty=false; }
  /* 推送前先拉一次：知道自己不认识的那些字段（背景/分类）当前是什么，才能原样带回去 */
  function buildPush(remoteCode){
    if(remoteCode) keepExtra(parse(remoteCode));
    var c = mkCode(); if(!c) return Promise.resolve("none");
    var t = Date.now();
    return send({room:room, code:c, t:t}).then(function(j){
      if(j && j.kept){ keepExtra(parse(j.code)); applyCode(j.code); mark(j.code, j.t||t); return "kept"; }
      mark(c, t);
      return "sent";
    });
  }
  function pushNow(){
    if(!room) return Promise.resolve("none");
    return pull().then(function(j){ return buildPush(j && j.code); });
  }
  function cycle(silent){
    if(!room || busy) return Promise.resolve("busy");
    busy = true; setState("同步中…","busy");
    return pull().then(function(j){
      if(!j.code){ return buildPush(null).then(function(){ return "new"; }); }
      keepExtra(parse(j.code));
      var rt = j.t || 0;
      if(dirty){ return buildPush(j.code).then(function(){ return "dirty"; }); }
      if(rt > localT){ applyCode(j.code); mark(j.code, rt); return "got"; }
      if(rt < localT){ return buildPush(j.code).then(function(){ return "sent"; }); }
      lastPushed = j.code; return "same";
    }).then(function(kind){
      busy = false;
      setState("已连接 · "+fmt(localT), "on");
      if(!silent){
        if(kind === "got"){ msg("已从另一台设备更新（"+fmt(localT)+"）"); say("已同步另一台设备的改动"); }
        else if(kind === "same") msg("已是最新 · "+fmt(localT));
        else msg("已上传本机内容（"+fmt(localT)+"）");
      }
      return kind;
    }).catch(function(e){
      busy = false; setState("云端未连接","err");
      if(!silent) msg("云同步失败："+(e && e.message ? e.message : ("连接不上 " + CLOUD_BASE)), true);
      return "err";
    });
  }
  function schedule(){
    if(!room) return;
    clearTimeout(timer);
    timer = setTimeout(function(){
      if(busy) return;
      var c = mkCode(); if(!c || c === lastPushed) return;
      dirty = true; lsSet(DIRTY_KEY,"1");
      pushNow().then(function(){
        setState("已连接 · "+fmt(localT), "on");
        msg("已自动上传 "+fmt(localT));
      }).catch(function(){ setState("待上传","err"); msg("改动已存在本机，联网后会自动上传", true); });
    }, 1500);
  }
  function startPoll(){
    stopPoll();
    poll = setInterval(function(){
      if(document.hidden || !room || busy) return;
      var c = mkCode();
      if(c && c !== lastPushed){ schedule(); return; }
      cycle(true);
    }, 20000);
  }
  function stopPoll(){ if(poll){ clearInterval(poll); poll=null; } }
  function flush(){
    if(!room) return;
    var c = mkCode(); if(!c || c === lastPushed) return;
    var t = Date.now();
    send({room:room, code:c, t:t}, true); mark(c, t);
  }
  function newRoom(){
    var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s="";
    for(var i=0;i<6;i++) s += a.charAt(Math.floor(Math.random()*a.length));
    return s;
  }
  function render(){
    var setup=el("csSetup"), live=el("csLive"), ri=el("csRoom");
    if(setup) setup.hidden = !!room;
    if(live) live.hidden = !room;
    if(room){
      if(ri) ri.value = room;
      setState("已连接 "+room,"on");
      note("房间 "+room+"：手机和 iPad 都填这个码，任意一端改完，另一端 20 秒内自动更新。");
    } else {
      setState("未开启","");
      note("开启后，手机改完 iPad 自动显示，和液态玻璃版共用同一间房。");
    }
  }
  function join(r){
    r = String(r||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,10);
    if(r.length < 4){ msg("房间码至少 4 位（字母或数字）", true); return; }
    room = r; lsSet(ROOM_KEY, room);
    localT = parseInt(lsGet(T_KEY)||"0", 10) || 0;
    lastPushed = lsGet(LAST_KEY) || "";
    dirty = lsGet(DIRTY_KEY) === "1";
    render(); startPoll();
    cycle(true).then(function(kind){
      if(kind === "got"){ msg("已连接 "+room+"，已载入云端内容"); say("云同步已连接"); }
      else if(kind === "same") msg("已连接 "+room+"，已是最新");
      else if(kind === "err") msg("房间 "+room+" 已记住，但云端暂时连不上", true);
      else msg("已连接 "+room+"，本机内容已上传");
    });
  }
  function leave(){
    room=""; lsSet(ROOM_KEY,""); lsSet(DIRTY_KEY,"0"); lastPushed=""; stopPoll();
    render(); msg("已关闭云同步，本机内容保留");
  }
  function copyLink(){
    var url = location.origin + location.pathname + "?room=" + room;
    function done(){ msg("配对链接已复制，在另一台设备打开就自动连上"); }
    function fb(){
      try{ var ta=document.createElement("textarea"); ta.value=url;
        ta.style.position="fixed"; ta.style.top="-1000px"; document.body.appendChild(ta); ta.select();
        var ok=document.execCommand("copy"); ta.remove();
        msg(ok ? "配对链接已复制，在另一台设备打开就自动连上" : url, !ok);
      }catch(e){ msg(url, true); }
    }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, fb);
    else fb();
  }
  function openSheet(){ var m=el("csMask"); if(!m) return; m.hidden=false; if(room) cycle(false); }
  function closeSheet(){ var m=el("csMask"); if(m) m.hidden=true; }
  function init(){
    var o=el("csOpen"), m=el("csMask"); if(!o || !m) return;
    o.addEventListener("click", openSheet);
    var cb=el("csClose"), b1=el("csCreate"), b2=el("csJoin"), b3=el("csNow"), b4=el("csLink"), b5=el("csOff"), ri=el("csRoom");
    if(cb) cb.addEventListener("click", closeSheet);
    m.addEventListener("click", function(e){ if(e.target === m) closeSheet(); });
    if(b1) b1.addEventListener("click", function(){
      var r=newRoom(); if(ri) ri.value=r; join(r);
      msg("房间已创建："+r+"　在另一台设备上填这个码，或点「复制配对链接」");
    });
    if(b2) b2.addEventListener("click", function(){ join(ri ? ri.value : ""); });
    if(ri) ri.addEventListener("keydown", function(e){ if(e.key === "Enter") join(ri.value); });
    if(b3) b3.addEventListener("click", function(){ cycle(false); });
    if(b4) b4.addEventListener("click", copyLink);
    if(b5) b5.addEventListener("click", leave);
    ["click","input","change","keyup"].forEach(function(ev){
      document.addEventListener(ev, function(e){
        if(!room) return;
        if(e && e.target && e.target.closest && e.target.closest("#csMask")) return;
        schedule();
      }, true);
    });
    document.addEventListener("visibilitychange", function(){
      if(document.hidden) flush(); else if(room && !busy) cycle(true);
    });
    window.addEventListener("pagehide", flush);
    if(ri) ri.value = DEFAULT_ROOM;
    var q = String(location.search||"").match(/[?&]room=([A-Za-z0-9]+)/);
    if(q && q[1]){ try{ history.replaceState(null,"",location.pathname); }catch(e){} join(q[1]); return; }
    var saved = lsGet(ROOM_KEY);
    if(saved){
      room = saved; localT = parseInt(lsGet(T_KEY)||"0",10) || 0;
      lastPushed = lsGet(LAST_KEY) || ""; dirty = lsGet(DIRTY_KEY) === "1";
      render(); startPoll(); cycle(true);
    } else render();
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
<script>
/* ===== 添加计划面板 ===== */
(function(){
  var mask=null, listEl=null, inputEl=null, mgrBtn=null, titleEl=null, hintEl=null, editMode=false, built=false, pendingSlot="", pendingLabel="";
  function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function chipsList(){ try{ return (typeof chips==="function") ? chips() : []; }catch(e){ return []; } }
  function build(){
    if(built) return; built=true;
    mask = el("div","ps-mask"); mask.id="psMask"; mask.hidden=true;
    var sheet = el("div","ps-sheet");
    sheet.appendChild(el("div","ps-bar"));
    var head = el("div","ps-head");
    titleEl = el("div","ps-title","添加计划");
    head.appendChild(titleEl);
    sheet.appendChild(head);
    var sub = el("div","ps-sub");
    hintEl = el("span","ps-subtxt","");
    sub.appendChild(hintEl);
    mgrBtn = el("button","ps-mgr","管理"); mgrBtn.id="psMgr";
    sub.appendChild(mgrBtn); sheet.appendChild(sub);
    listEl = el("div","ps-chips"); listEl.id="psChips";
    sheet.appendChild(listEl);
    mask.appendChild(sheet); document.body.appendChild(mask);
    mask.addEventListener("click", function(e){ if(e.target===mask) closePanel(); });
    mgrBtn.addEventListener("click", function(){ editMode=!editMode; mgrBtn.textContent = editMode?"完成":"管理"; renderChips(); });
    listEl.addEventListener("click", onChip);
  }
  function renderChips(){
    if(!listEl) return;
    listEl.innerHTML = "";
    chipsList().forEach(function(x){
      var w = el("span","ps-wrap");
      var b = el("button","ps-chip", x);
      b.setAttribute("data-add", x);
      if(editMode) b.setAttribute("data-ren", x);
      w.appendChild(b);
      if(editMode){
        var del = el("button","ps-x","✕");
        del.setAttribute("data-del", x);
        w.appendChild(del);
      }
      listEl.appendChild(w);
    });
    var nb = el("button","ps-chip ps-new","＋ 新建");
    nb.setAttribute("data-new","1");
    listEl.appendChild(nb);
  }
  function addCustom(){
    var v = String(inputEl.value||"").trim();
    if(!v) return;
    addPlan("", v);
    inputEl.value = "";
    renderChips();
    try{ toast("已加入今天：" + v); }catch(e){}
  }
  function startRename(btn, oldT){
    var wrap = btn.parentNode;
    var box = el("span","ps-edit");
    var inp = el("input"); inp.value = oldT;
    var okb = el("button", null, "改");
    box.appendChild(inp); box.appendChild(okb);
    wrap.innerHTML = ""; wrap.appendChild(box);
    inp.focus();
    function commit(){ var v=String(inp.value||"").trim(); if(v && v!==oldT) renameChip(oldT, v); renderChips(); }
    okb.addEventListener("click", function(e){ e.stopPropagation(); commit(); });
    inp.addEventListener("click", function(e){ e.stopPropagation(); });
    inp.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); commit(); } });
  }
  function startNew(btn){
    var box = el("span","ps-edit");
    var inp = el("input"); inp.setAttribute("placeholder","新的常用计划");
    var okb = el("button", null, "加");
    box.appendChild(inp); box.appendChild(okb);
    btn.parentNode.replaceChild(box, btn);
    inp.focus();
    function commit(){ var v=String(inp.value||"").trim(); if(!v) return; addChip(v); if(pendingSlot){ addPlan(pendingSlot, v, true); renderChips(); closePanel(); return; } renderChips(); }
    okb.addEventListener("click", function(e){ e.stopPropagation(); commit(); });
    inp.addEventListener("click", function(e){ e.stopPropagation(); });
    inp.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); commit(); } });
  }
  function onChip(e){
    var t = e.target;
    if(!t || !t.closest) return;
    var del = t.closest("[data-del]");
    if(del){ delChip(del.getAttribute("data-del")); renderChips(); return; }
    if(editMode){
      var ren = t.closest("[data-ren]");
      if(ren){ startRename(ren, ren.getAttribute("data-ren")); return; }
    }
    var nw = t.closest("[data-new]");
    if(nw){ startNew(nw); return; }
    var add = t.closest("[data-add]");
    if(add){
      var pv = add.getAttribute("data-add");
      if(pendingSlot){ addPlan(pendingSlot, pv, true); renderChips(); closePanel(); return; }
      addPlan("", pv);
      renderChips();
      try{ toast("已加入今天：" + pv); }catch(e2){}
      closePanel();
    }
  }
function updHead(){
if(titleEl) titleEl.textContent = pendingSlot ? "排到空档 " + pendingLabel : "添加计划";
if(hintEl) hintEl.textContent = pendingSlot ? "点一下就排进去 · 以后每周这个时段自动出现" : "";
}
function show(){
build();
editMode = false;
if(mgrBtn) mgrBtn.textContent = "管理";
if(inputEl) inputEl.value = "";
renderChips();
updHead();
mask.hidden = false;
}
function openPanel(){ pendingSlot = ""; pendingLabel = ""; show(); }
function openSlot(slot, label){ pendingSlot = slot || ""; pendingLabel = label || ""; show(); }
function closePanel(){ if(mask) mask.hidden = true; }
  document.addEventListener("click", function(e){
    var t = e.target;
    if(t && t.closest && t.closest('[data-act="openadd"]')) openPanel();
  }, true);
  window.__addPanel = {open: openPanel, close: closePanel, openSlot: openSlot};
})();
</script>
<script>
/* ===== iOS 式手势：所有面板都能拖下去关掉 ===== */
(function(){
  var SEL = ".sheet-mask, .modal-mask, .ps-mask, .sync-mask, .cat-menu-mask";
  var CLOSERS = ".ps-close, .dl-close, .sheet-close, .sync-close, .cm-close, .cat-menu .cm-close";
  var HANDLES = ".sheet-bar, .ps-bar, .sheet-head, .dl-head, .cs-head, .ps-head, .sync-head";

  function firstChild(mask){
    for(var i=0;i<mask.children.length;i++){ if(mask.children[i].nodeType === 1) return mask.children[i]; }
    return null;
  }
  function scrolledDeep(node, stop, horiz){
    var el = node;
    while(el && el !== stop){
      if(horiz ? (el.scrollLeft > 1) : (el.scrollTop > 1)) return true;
      el = el.parentNode;
    }
    return false;
  }

  function isHandle(t){ return !!(t && t.closest && t.closest(HANDLES)); }
  function closeIt(mask, sheet){
    var b = sheet.querySelector(CLOSERS);
    if(b){ b.click(); return; }
    mask.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  }
  function reset(mask, sheet){
    sheet.style.transition = "none";
    sheet.style.transform = "";
    mask.style.backgroundColor = "";
    mask.style.webkitBackdropFilter = "";
    mask.style.backdropFilter = "";
    mask.classList.remove("dragging");
    setTimeout(function(){ sheet.style.transition = ""; }, 40);
  }
  function syncLock(){
    var list = document.querySelectorAll(SEL), any = false;
    for(var i=0;i<list.length;i++){ if(!list[i].hidden){ any = true; break; } }
    if(document.body) document.body.classList.toggle("lock-scroll", any);
  }
  function animateOut(mask, sheet){
    if(mask.__closing) return;
    mask.__closing = true;
    var vert = (getComputedStyle(mask).alignItems === "flex-end");
    sheet.style.transition = "transform .3s cubic-bezier(.32,.72,0,1)";
    sheet.style.transform = vert ? "translateY(104%)" : "translateX(104%)";
    /* 只淡出遮罩颜色：整层 opacity 会把面板也一起变透明，看起来就是闪 */
    mask.style.transition = "background-color .26s ease";
    mask.style.backgroundColor = "rgba(20,19,17,0)";
    /* 收起全程都别开模糊，否则滑完会再虚化一下 */
    mask.style.webkitBackdropFilter = "none";
    mask.style.backdropFilter = "none";
    var d = Object.getOwnPropertyDescriptor(HTMLElement.prototype, "hidden");
    setTimeout(function(){
      d.set.call(mask, true);
      reset(mask, sheet);
      mask.style.transition = "";
      mask.__closing = false;
      syncLock();
    }, 280);
  }
  /* 关面板时先播动画再真正隐藏：所有面板（包括点遮罩、点✕）都走这里 */
  function guard(mask, sheet){
    if(mask.__iosGuard) return;
    var d = Object.getOwnPropertyDescriptor(HTMLElement.prototype, "hidden");
    if(!d || !d.set) return;
    mask.__iosGuard = true;
    Object.defineProperty(mask, "hidden", {
      configurable: true,
      get: function(){ return d.get.call(mask); },
      set: function(v){
        if(v === true && !d.get.call(mask)){
          if(!mask.__closing) animateOut(mask, sheet);
          return;
        }
        d.set.call(mask, v);
        syncLock();
      }
    });
  }
  function setup(mask){
    if(mask.__iosDrag) return;
    var sheet = firstChild(mask);
    if(!sheet) return;
    mask.__iosDrag = true;
    guard(mask, sheet);
    syncLock();
    var on = false, handle = false, blocked = false, tgt = null, vert = true;
    var x0 = 0, y0 = 0, dx = 0, dy = 0, t0 = 0, W = 1, H = 1, moved = false;

    function begin(cx, cy, target, isHandle){
      if(mask.hidden) return false;
      var r = sheet.getBoundingClientRect();
      vert = (getComputedStyle(mask).alignItems === "flex-end");
      on = true; moved = false; handle = !!isHandle; tgt = target;
      /* 里层列表没滚到顶：这一下交给列表滚动，别抢 */
      blocked = (!isHandle && scrolledDeep(target, mask, !vert));
      x0 = cx; y0 = cy; dx = 0; dy = 0; t0 = Date.now();
      W = r.width || 380; H = r.height || 520;
      sheet.style.transition = "none";
      return true;
    }
    function move(cx, cy){
      if(!on) return false;
      dx = cx - x0; dy = cy - y0;
      var d = vert ? dy : dx;
      if(!moved){
        /* 横向为主的滑动（左右滑新闻分类、滑横向列表）交给页面自己处理，别把面板拖着走 */
        if(vert && Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy) * 1.2){ on = false; return false; }
        if(d < -8){ on = false; return false; }
        if(Math.abs(d) < 3) return false;
        if(blocked || (!handle && scrolledDeep(tgt, mask, !vert))){ on = false; return false; }
        moved = true;
        mask.classList.add("dragging");
      }
      var size = vert ? H : W;
      var cap = size * 0.62;
      var v = d > cap ? cap + (d - cap) * 0.32 : d;
      sheet.style.transform = vert ? ("translateY(" + v.toFixed(1) + "px)") : ("translateX(" + v.toFixed(1) + "px)");
      var p = Math.min(1, Math.max(0, v / size));
      mask.style.backgroundColor = "rgba(20,19,17," + (0.45 * (1 - p * 0.8)).toFixed(3) + ")";
      return true;
    }
    function end(){
      document.body.style.webkitUserSelect = "";
      document.body.style.userSelect = "";
      if(!on) return;
      on = false;
      if(!moved){ mask.classList.remove("dragging"); sheet.style.transition = ""; return; }
      var d = vert ? dy : dx;
      var size = vert ? H : W;
      var speed = d / Math.max(1, Date.now() - t0);
      var out = d > size * 0.26 || speed > 0.55;
      mask.classList.remove("dragging");
      sheet.style.transition = "transform .28s cubic-bezier(.22,.9,.28,1)";
      if(out){
        closeIt(mask, sheet);
        setTimeout(function(){ if(!mask.hidden) reset(mask, sheet); }, 420);
      } else {
        sheet.style.transform = "";
        setTimeout(function(){ mask.style.backgroundColor = ""; sheet.style.transition = ""; }, 300);
      }
    }
    sheet.addEventListener("touchstart", function(e){
      if(e.touches.length !== 1) return;
      var t = e.touches[0];
      begin(t.clientX, t.clientY, e.target, isHandle(e.target));
    }, {passive:true});
    sheet.addEventListener("touchmove", function(e){
      if(!on) return;
      var t = e.touches[0];
      if(move(t.clientX, t.clientY) && e.cancelable) e.preventDefault();
    }, {passive:false});
    sheet.addEventListener("touchend", end, {passive:true});
    sheet.addEventListener("touchcancel", end, {passive:true});
    sheet.addEventListener("mousedown", function(e){
      if(e.button !== 0) return;
      if(!begin(e.clientX, e.clientY, e.target, isHandle(e.target))) return;
      /* 这里绝不能 preventDefault：那会把「轻点输入框就聚焦」一起吞掉 */
      document.body.style.webkitUserSelect = "none";
      document.body.style.userSelect = "none";
    });
    window.addEventListener("mousemove", function(e){ if(on) move(e.clientX, e.clientY); });
    window.addEventListener("mouseup", function(){ if(on) end(); });
  }


  function scan(){
    var list = document.querySelectorAll(SEL);
    for(var i=0;i<list.length;i++) setup(list[i]);
  }
  scan();
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", scan);
  setTimeout(scan, 800);
  setTimeout(scan, 2500);
  if(window.MutationObserver){
    new MutationObserver(function(){ scan(); }).observe(document.body, {childList:true, subtree:false});
  }
  if(window.MutationObserver){
    var mo = new MutationObserver(function(){ syncLock(); });
    document.querySelectorAll(SEL).forEach(function(m){
      mo.observe(m, {attributes:true, attributeFilter:["hidden"]});
    });
  }
  window.__iosSheets = {refresh: scan};

})();
</script>
<script>
/* ===== 新闻速递：在列表上左右滑 = 切换分类（和点标签等价） ===== */
(function(){
  var list = document.getElementById("newsList");
  if(!list) return;
  var x0 = 0, y0 = 0, dx = 0, on = false, axis = "";
  function idx(){
    for(var i=0;i<NEWS_CATS.length;i++){ if(NEWS_CATS[i][0] === newsCat) return i; }
    return -1;
  }
  function go(dir){
    var i = idx(); if(i < 0) return;
    var j = i + dir;
    if(j < 0 || j >= NEWS_CATS.length) return;
    newsCat = NEWS_CATS[j][0];
    try{ renderNews(); }catch(e){ return; }
    list.classList.remove("pg-l", "pg-r");
    void list.offsetWidth;
    list.classList.add(dir > 0 ? "pg-l" : "pg-r");
    setTimeout(function(){ try{ list.classList.remove("pg-l", "pg-r"); }catch(e){} }, 300);
  }
  list.addEventListener("touchstart", function(e){
    if(e.touches.length !== 1) return;
    var t = e.touches[0];
    x0 = t.clientX; y0 = t.clientY; dx = 0; axis = ""; on = true;
  }, {passive:true});
  list.addEventListener("touchmove", function(e){
    if(!on) return;
    var t = e.touches[0], ax = t.clientX - x0, ay = t.clientY - y0;
    if(!axis && (Math.abs(ax) > 8 || Math.abs(ay) > 8)){
      axis = (Math.abs(ax) > Math.abs(ay) * 1.2) ? "x" : "y";
    }
    if(axis === "x"){ dx = ax; if(e.cancelable) e.preventDefault(); }
  }, {passive:false});
  function fin(){
    if(!on) return;
    on = false;
    if(axis === "x" && Math.abs(dx) > 55) go(dx < 0 ? 1 : -1);
  }
  list.addEventListener("touchend", fin, {passive:true});
  list.addEventListener("touchcancel", function(){ on = false; }, {passive:true});
})();
</script>
<script>
/* ===== 键盘/可见区域变化时：面板跟着走，别被顶出屏幕 ===== */
(function(){
  var SEL = ".sheet-mask, .modal-mask, .ps-mask, .sync-mask, .cat-menu-mask";
  function sync(){
    var vv = window.visualViewport;
    if(!vv) return;
    var list = document.querySelectorAll(SEL);
    for(var i=0;i<list.length;i++){
      var m = list[i];
      m.style.top = Math.round(vv.offsetTop) + "px";
      m.style.left = Math.round(vv.offsetLeft) + "px";
      m.style.right = "auto";
      m.style.bottom = "auto";
      m.style.width = Math.round(vv.width) + "px";
      m.style.height = Math.round(vv.height) + "px";
      m.style.setProperty("--vvh", Math.round(vv.height) + "px");
    }
  }
  window.__vvSync = sync;
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", sync);
    window.visualViewport.addEventListener("scroll", sync);
  }
  window.addEventListener("resize", sync);
  window.addEventListener("orientationchange", function(){ sync(); setTimeout(sync, 300); });
  /* 输入框获得焦点：把可见区对齐好，并让输入框自己滚进来（而不是让 iOS 平移整页） */
  document.addEventListener("focusin", function(e){
    var t = e.target;
    if(!t || !t.tagName) return;
    if(t.tagName !== "INPUT" && t.tagName !== "TEXTAREA") return;
    sync();
    setTimeout(sync, 80);
    setTimeout(sync, 320);
    setTimeout(function(){ try{ t.scrollIntoView({block:"nearest"}); }catch(err){} }, 360);
    setTimeout(sync, 900);
  }, true);
  document.addEventListener("focusout", function(){ setTimeout(sync, 80); setTimeout(sync, 400); }, true);
  setTimeout(sync, 200);
})();
</script>
