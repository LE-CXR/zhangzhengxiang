<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法学课表 · 2026-2027第一学期</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='5' width='18' height='16' rx='3' fill='%232f6fed'/%3E%3Crect x='3' y='9' width='18' height='3' fill='%231b4fd8'/%3E%3Crect x='7' y='2' width='2' height='5' fill='%232f6fed'/%3E%3Crect x='15' y='2' width='2' height='5' fill='%232f6fed'/%3E%3Crect x='7' y='13' width='4' height='2' fill='white'/%3E%3Crect x='13' y='13' width='4' height='2' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f4ef; --card:#fdfdfb; --ink:#1f1e1d; --sub:#7d7a72; --line:#e6e4dd;
  --brand:#2f6fed; --brand-dark:#1b4fd8;
  --accent:#c15f3c; --accent-deep:#a84a2b;
  --russ:#2f6fed; --comm:#0ea5a0; --vocal:#d97706; --moral:#b3452f;
  --policy:#b3452f; --chess:#3f7a4e; --stock:#274b8f; --psych:#7c5cbf; --other:#5b6b8c;
  --up:#d92c30; --down:#0f9d5c;
  --card2:#fbfaf6; --badge:#eef0f8; --today:#eef4ff; --todayb:#bcd2ff;
  --dash:#b8b4ab; --axis:#a9a69d;
}
html.dark{
  --bg:#1a1917; --card:#262522; --ink:#eceae6; --sub:#a19d97; --line:#383632;
  --brand:#7c9bff; --brand-dark:#a5b8ff;
  --accent:#da7756; --accent-deep:#c05f3f;
  --russ:#5c8bff; --comm:#21c6c0; --vocal:#f0a13c; --moral:#cf6a4f;
  --policy:#cf6a4f; --chess:#56a471; --stock:#4a7ac2; --psych:#9d7fd8; --other:#7f8aa6;
  --up:#ff5a62; --down:#21d68e;
  --card2:#1f1e1c; --badge:#322f2c; --today:#2c2723; --todayb:#4a382c;
  --dash:#5b5b63; --axis:#6e6e76;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding:20px 14px 48px}
.wrap{max-width:1060px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-top:16px;box-shadow:0 1px 2px rgba(31,30,29,.03),0 16px 40px -20px rgba(31,30,29,.16)}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent);flex:none}
.card h2 svg{flex:none}
/* 今日 */
.today-meta{display:inline-block;font-size:14px;font-weight:700;color:#fff;background:var(--accent);border-radius:20px;padding:4px 14px;margin-bottom:14px}
.today-list{display:flex;flex-direction:column;gap:14px}
.t-item{display:flex;gap:16px;align-items:stretch;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card2)}
.t-time{flex:none;min-width:112px;text-align:left}
.t-time .range{font-weight:800;font-size:19px;color:var(--accent);letter-spacing:.3px}
.t-time .slot{font-size:13.5px;color:var(--sub);margin-top:2px}
.t-body{flex:1;min-width:0}
.t-loc{font-weight:700;font-size:19px;line-height:1.3}
.t-name{font-weight:600;font-size:15.5px;color:var(--ink);margin-top:2px}
.t-line{font-size:13.5px;color:var(--sub);margin-top:2px}
.t-flag{flex:none;align-self:center;width:8px;height:44px;border-radius:4px}
.today-gap{margin:3px 0;border:1px dashed var(--todayb);background:var(--today);border-radius:12px;padding:4px 10px}
.gap-row{display:flex;align-items:center;gap:6px;min-height:24px}

/* 今日课程表头：周徽标 + 下节课提醒（颜色取该门课的颜色） */
.today-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.today-row .today-meta{margin-bottom:0}
.next-tip{flex:0 1 auto;max-width:70%;min-width:0;display:flex;align-items:center;gap:8px;padding:6px 10px 7px 8px;border-radius:14px;background:rgba(218,119,86,.10);background:color-mix(in srgb,var(--nt,#da7756) 11%,transparent);box-shadow:inset 0 0 0 1px rgba(218,119,86,.20);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--nt,#da7756) 24%,transparent);animation:ntIn .3s cubic-bezier(.22,1,.36,1)}
.next-tip[hidden]{display:none}
.next-tip .nt-ic{flex:none;width:25px;height:25px;border-radius:9px;display:grid;place-items:center;color:var(--nt,#da7756);background:rgba(218,119,86,.16);background:color-mix(in srgb,var(--nt,#da7756) 18%,transparent)}
.next-tip .nt-body{min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.22}
.next-tip .nt-when{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;font-weight:800;letter-spacing:.2px;color:var(--nt,#da7756);background:rgba(218,119,86,.16);background:color-mix(in srgb,var(--nt,#da7756) 18%,transparent);padding:2px 6px;border-radius:999px;margin-bottom:1px}
.next-tip .nt-room{font-size:13.5px;font-weight:800;color:var(--nt,#da7756);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next-tip .nt-sub{font-size:11.5px;color:var(--nt,#da7756);opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes ntIn{from{opacity:0;transform:translateY(-4px) scale(.96)}to{opacity:1;transform:none}}

/* 现在时间线（iOS 日历风）：一条橙线 + 左侧圆点 + 时间 */
.now-line{display:flex;align-items:center;gap:8px;margin:2px 2px 6px}
.now-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(218,119,86,.15)}
.now-txt{flex:none;font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.2px;font-variant-numeric:tabular-nums}
.now-rule{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(218,119,86,.85),rgba(218,119,86,.10))}
/* 正在上课 / 正在空档 */
.t-item.is-now{border-color:var(--accent);box-shadow:0 0 0 1px rgba(218,119,86,.35),0 6px 18px -12px rgba(218,119,86,.6);background:linear-gradient(0deg,rgba(218,119,86,.06),rgba(218,119,86,.06)),var(--card2)}
.t-item.is-now .t-flag{width:10px}
.now-badge{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:12.5px;font-weight:800;color:var(--accent);white-space:nowrap}
.now-badge i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);animation:nowPulse 1.7s ease-in-out infinite}
@keyframes nowPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.now-badge i{animation:none}}
.today-gap.is-now{border-style:solid;border-color:var(--accent);background:rgba(218,119,86,.10)}
.today-gap.is-now .gap-badge{background:var(--accent);color:#fff;border-color:var(--accent)}
.today-gap.is-now .gap-tip{color:var(--accent);font-weight:800}
.gap-badge{flex:none;font-size:10px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 4px;line-height:13px;opacity:.9}
.gap-time{flex:none;font-size:12px;font-weight:800;color:var(--accent);white-space:nowrap;letter-spacing:-.2px}
.gap-len{flex:none;font-size:11.5px;color:var(--sub);white-space:nowrap}
.gap-tip{flex:1 1 auto;min-width:0;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gap-add{flex:none;margin-left:auto;border:none;background:transparent;color:var(--accent);padding:3px 0;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .1s}
.gap-add:active{transform:scale(.92)}
.gap-list{margin-top:6px;margin-bottom:0}
.gap-list .plan-rep,.gap-list .plan-del{opacity:.5;width:32px;height:32px}
@media (max-width:430px){.gap-len{display:none}}
.plan-head{font-size:15px;font-weight:800;margin:2px 0 10px;display:flex;align-items:center;gap:8px}
.plan-head::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent);flex:none}
.plan-sub{font-size:12px;font-weight:700;color:var(--sub);margin:0 0 7px}
.plan-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.plan-chip{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:13.5px;cursor:pointer;transition:border-color .15s,transform .1s}
.plan-chip:hover{border-color:var(--accent)}
.plan-chip:active{transform:scale(.95)}
.plan-chip.small{font-size:12.5px;padding:6px 12px}
.plan-chip.xsmall{font-size:12px;padding:5px 10px}
.plan-subrow{display:flex;align-items:center;justify-content:flex-end;margin:0 0 7px}
.plan-subrow .plan-sub{margin:0}
.plan-etoggle{border:none;background:none;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;padding:2px 4px}
.plan-etoggle.on{color:var(--sub)}
.chip-wrap{position:relative;display:inline-flex}
.chip-x{position:absolute;top:-6px;right:-5px;width:18px;height:18px;border-radius:50%;border:2px solid var(--card);background:#e05a5a;color:#fff;font-size:10px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.plan-chip.addchip{border-style:dashed;color:var(--sub)}
.chip-edit{display:inline-flex;gap:6px;align-items:center}
.chip-edit input{border:1px solid var(--accent);border-radius:20px;padding:8px 12px;font-size:16px;background:var(--card);color:var(--ink);width:132px}
.plan-prog{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.plan-prog-txt{font-size:12.5px;color:var(--sub);flex:none}
.plan-prog-txt b{color:var(--accent);font-size:14px}
.plan-bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.plan-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .35s ease}
.plan-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.plan-item{display:flex;align-items:center;gap:8px;padding:11px 12px 11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:14.5px;transition:background .2s,border-color .2s}
.plan-item.done{background:var(--today);border-color:var(--todayb)}
.plan-item.done .plan-text{color:var(--sub);text-decoration:line-through}
.plan-text{flex:1;min-width:0;line-height:1.4}
.plan-done{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;font-size:15px;font-weight:700;padding:0;transition:background .18s,border-color .18s,color .18s}
.plan-item.done .plan-done{background:var(--accent);border-color:var(--accent);color:#fff}
.plan-done.pop{animation:pop .42s cubic-bezier(.2,1.5,.35,1)}
@keyframes pop{0%{transform:scale(.72)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
.plan-del{flex:none;width:26px;height:26px;border:none;background:none;color:var(--sub);font-size:13px;cursor:pointer;opacity:.22;transition:opacity .15s}
.plan-del:hover{opacity:.85}
/* ===== iOS 式下拉关闭：横杠/表头可直接拖 ===== */
.sheet-bar, .ps-bar, .sheet-head, .dl-head, .cs-head, .ps-head{ touch-action:none; -webkit-user-select:none; user-select:none; }
.sheet-bar, .ps-bar{ cursor:grab; }
.dragging .sheet-bar, .dragging .ps-bar{ cursor:grabbing; }
.dragging .news-sheet, .dragging .modal, .dragging .cs-sheet, .dragging .ps-sheet, .dragging .sync-sheet{
  box-shadow:0 -18px 50px -20px rgba(0,0,0,.45) !important; }
.sheet-mask.dragging, .modal-mask.dragging, .ps-mask.dragging, .sync-mask.dragging, .cat-menu-mask.dragging{
  -webkit-backdrop-filter:none; backdrop-filter:none; }
/* 键盘弹起时：面板高度跟着可见区域收缩 */
@media(max-width:899px){
  .modal-mask > .modal, .sheet-mask > .news-sheet, .sheet-mask > .cs-sheet,
  .ps-mask > .ps-sheet, .sync-mask > .sync-sheet, .cat-menu-mask > .cat-menu{
    max-height: min(85vh, calc(var(--vvh, 100vh) - 10px)) !important; }
}

/* 面板内滚动不要带动背后页面 */
.modal, .news-sheet, .cs-sheet, .ps-sheet, .sync-sheet, .cat-menu{ overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
/* 移动端面板打开动画（桌面端抽屉用 slideright，别覆盖） */
@media(max-width:899px){
  .modal, .cs-sheet, .ps-sheet{ animation:slideup .28s cubic-bezier(.2,.9,.3,1.05); }
}


.plan-addrow{display:flex;justify-content:center;margin:14px 0 2px}
.plan-addbtn{border:1px dashed var(--line);background:none;color:var(--sub);border-radius:12px;padding:4px 11px;font-size:11.5px;
  opacity:.85;cursor:pointer;font-family:inherit;transition:transform .12s}
.plan-addbtn:active{transform:scale(.97)}
.ps-mask{position:fixed;inset:0;background:rgba(20,19,17,.45);z-index:120;display:flex;align-items:flex-end;justify-content:center}
.ps-mask[hidden]{display:none}
html.dark .ps-mask{background:rgba(0,0,0,.62)}
.ps-sheet{width:100%;max-width:560px;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:10px 18px 26px;max-height:86vh;overflow:auto}
.ps-bar{width:38px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 10px}
.ps-head{display:flex;align-items:center;margin-bottom:12px}
.ps-title{font-size:18px;font-weight:800}
.ps-close{margin-left:auto;border:none;background:var(--badge);width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--sub);cursor:pointer}
.ps-row{display:flex;gap:8px;margin-bottom:14px}
.ps-input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;
  font-size:16px;font-family:inherit}
.ps-ok{flex:none;border:none;background:var(--accent);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer}
.ps-sub{display:flex;align-items:center;margin-bottom:9px}
.ps-subtxt{font-size:12.5px;color:var(--sub)}
.ps-mgr{margin-left:auto;border:none;background:none;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;padding:2px 4px}
.ps-chips{display:flex;flex-wrap:wrap;gap:8px}
.ps-wrap{position:relative;display:inline-flex}
.ps-chip{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:20px;padding:9px 14px;font-size:13.5px;
  cursor:pointer;font-family:inherit;transition:transform .12s}
.ps-chip:active{transform:scale(.96)}
.ps-new{border-style:dashed;color:var(--sub)}
.ps-x{position:absolute;top:-6px;right:-5px;width:18px;height:18px;border-radius:50%;border:2px solid var(--card);background:#e05a5a;
  color:#fff;font-size:10px;line-height:1;cursor:pointer}
.ps-edit{display:inline-flex;gap:6px;align-items:center}
.ps-edit input{border:1px solid var(--accent);border-radius:20px;padding:9px 12px;font-size:16px;background:var(--card);
  color:var(--ink);width:150px;font-family:inherit}
.ps-edit button{border:none;background:var(--accent);color:#fff;border-radius:20px;padding:9px 14px;font-size:13.5px;font-weight:700;cursor:pointer}

.plan-rep{flex:none;width:26px;height:26px;border:none;background:none;color:var(--sub);font-size:14px;cursor:pointer;opacity:.3;transition:opacity .15s,color .15s}
.plan-rep:hover{opacity:.9}
.plan-rep.on{color:var(--accent);opacity:1}
.plan-replab{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 5px;margin-left:6px;white-space:nowrap}
.plan-item.done .plan-del{opacity:.5}
.plan-edit{margin:0;display:flex;flex-direction:column;gap:8px}
.plan-edit-row{display:flex;gap:6px;align-items:center}
.plan-edit input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px;background:var(--card);color:var(--ink)}
.plan-ok{flex:none;border:none;background:var(--accent);color:#fff;border-radius:10px;padding:9px 15px;font-size:14px;font-weight:700;cursor:pointer}
.confetti{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:200;will-change:transform,opacity;animation:confetti .8s cubic-bezier(.2,.75,.3,1) forwards}
@keyframes confetti{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.35);opacity:0}}
html.dark .today-gap{background:#2b2620}
html.dark .now-dot{box-shadow:0 0 0 4px rgba(218,119,86,.22)}
html.dark .t-item.is-now{background:linear-gradient(0deg,rgba(218,119,86,.13),rgba(218,119,86,.13)),var(--card2)}
html.dark .today-gap.is-now{background:rgba(218,119,86,.18)}
html.dark .plan-item.done{background:#2b2620}
.plan-chips.compact{gap:6px;margin:2px 0 0}
.plan-chips.compact .plan-chip.small{padding:5px 11px;font-size:12.5px}
.plan-chips.compact .chip-x{width:16px;height:16px;font-size:9px}
.empty{color:var(--sub);font-size:14px;padding:8px 0}
/* 周视图 */
.week-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.week-toolbar label{font-size:14px;color:var(--sub)}
.week-toolbar select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:var(--card);color:var(--ink)}
.week-toolbar .badge{font-size:13px;color:var(--brand-dark);background:var(--badge);border-radius:20px;padding:3px 10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));gap:8px;min-width:900px}
.wday{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px}
.wday.today{background:var(--today);border-color:var(--accent)}
.wday-head{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px;display:flex;justify-content:space-between}
.wday.today .wday-head{color:var(--accent)}
.witem{border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:13px;color:#fff;line-height:1.35}
.witem .n{font-weight:600}
.witem .d{opacity:.9;font-size:12px;margin-top:2px}
/* 按钮 */
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;transition:background .15s}
.btn:hover{background:var(--brand-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f2f4f8}
.btn.mini{font-size:13px;padding:6px 12px;margin-left:auto}
html.dark .btn.ghost{background:#2c2a27;border-color:var(--line)}
.btn svg{flex:none}
.hint{font-size:13.5px;color:var(--sub);margin-top:10px}
/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f2937;color:#fff;font-size:14px;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:120}
#toast.show{opacity:1}
@media(max-width:640px){
  .card{padding:15px}
  .t-time{min-width:96px}
  .t-loc{font-size:18px}
}
/* ===== 每日一句 ===== */
.quote-card{text-align:center;padding:36px 24px 28px;background:linear-gradient(180deg,#fcfbf7 0%,#fdfdfb 100%)}
.q-label{font-size:12.5px;color:var(--sub);letter-spacing:.5px;margin-bottom:16px}
.q-text{font-family:Georgia,"Palatino Linotype","Book Antiqua",Palatino,"Times New Roman",serif;font-size:62px;font-weight:600;line-height:1.2;letter-spacing:.4px;color:var(--ink);text-wrap:balance;max-width:900px;margin:0 auto}
.q-src{font-size:14px;color:var(--accent);margin-top:14px}
/* ===== 行情速览（Apple 审美） ===== */
.mkt-meta{font-size:13px;color:var(--sub);margin-bottom:6px}
.mkt-sec{font-size:14px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.mkt-sec::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent);flex:none}
.mkt-sec:first-child{margin-top:8px}

.mkt-group{flex:none;width:400px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}

.mkt-logic .logic-sub{font-size:11.5px;color:var(--sub);opacity:.85}
.mkt-logic .logic-line{margin-top:4px}

.mkt-logic .logic-brief{margin-top:5px;cursor:pointer;font-size:12.5px;line-height:1.5}
.mkt-logic .logic-brief:active{opacity:.75}
.mkt-logic .logic-body{margin-top:2px}
.mkt-logic .logic-topic{color:var(--accent)}
.mkt-logic .logic-none{color:var(--sub);opacity:.85}
.mkt-logic .logic-k{display:inline-block;min-width:30px;color:var(--sub);font-size:12px;margin-right:4px}
.mkt-logic i.logic-kw{font-style:normal;color:var(--ink)}
.mkt-logic em{font-style:normal;color:var(--sub);font-size:12px;margin-left:6px}
.mkt-logic .logic-more{margin-top:9px;color:var(--accent);font-weight:700;font-size:12.5px;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.mkt-logic .logic-caret{transition:transform .2s}
.mkt-logic .logic-more.on .logic-caret{transform:rotate(90deg)}
.mkt-logic .logic-quotes{margin-top:8px;border-top:1px dashed var(--line)}
.mkt-logic .logic-quote{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px dashed var(--line);padding:8px 0;cursor:pointer;font:inherit;color:var(--ink)}
.mkt-logic .logic-quote:active{opacity:.7}
.mkt-logic .logic-quote-t{display:block;font-size:12.5px;line-height:1.45}
.mkt-logic .logic-quote-m{display:block;font-size:11.5px;color:var(--sub);margin-top:2px}
.mkt-logic .logic-foot{margin-top:9px;font-size:11.5px;color:var(--sub);opacity:.8}
/* 详情弹层 */
.modal-mask{position:fixed;inset:0;background:rgba(20,19,17,.45);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}

.dl-head{display:flex;align-items:flex-start;gap:10px}

.dl-close{margin-left:auto;border:none;background:var(--badge);width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--sub);cursor:pointer;flex:none}
.dl-price{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:14px}
.dl-chg{font-size:15px;font-weight:700;margin-top:2px}
.dl-tabs{display:flex;gap:4px;margin:18px 0 4px;border-bottom:1px solid var(--line);padding-bottom:8px;overflow-x:auto}
.dl-tabs button{border:none;background:none;font-size:14px;color:var(--sub);padding:4px 11px;border-radius:8px;cursor:pointer;font-weight:600;flex:none}
.dl-tabs button.on{color:#fff;background:var(--accent)}
.dl-chart{width:100%;height:236px;display:flex;align-items:center;justify-content:center}
.dl-chart svg{width:100%;height:100%}
.dl-chart .dl-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.dl-loading{font-size:13.5px;color:var(--sub)}
.dl-stats{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:13.5px}
.dl-stats .kv{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px dashed var(--line)}

  .quote-card{padding:28px 16px 24px}
}
/* ===== 暗色模式（22:00 - 07:00 自动启用，html.dark） ===== */
/* 新浪美股图主题化美化：折线主区裁剪 + 底部渐变淡出（Apple 阴影感）+ 暗色反色适配 */
.spark-img{
  object-fit:cover;
  object-position:50% 16%;
  border-radius:8px;
  filter:saturate(1.35) contrast(1.12);
  -webkit-mask-image:linear-gradient(180deg,#000 60%,rgba(0,0,0,.3) 86%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 60%,rgba(0,0,0,.3) 86%,transparent 100%);
}
html.dark .spark-img{
  filter:invert(.92) hue-rotate(180deg) saturate(.8) brightness(.98) contrast(1.15);
}
.dl-img img{
  border-radius:14px;
  filter:saturate(1.15) contrast(1.08);
}
.dl-fb{font-size:11px;color:var(--sub);text-align:center;margin-top:6px}
html.dark .dl-img img{
  filter:invert(.9) hue-rotate(180deg) saturate(.72) brightness(.96) contrast(1.18);
}
html.dark .quote-card{background:linear-gradient(180deg,#1e1d1b 0%,#262522 100%)}

html.dark .mkt-count.down{color:#3fe09a;background:#1c3329}

html.dark .witem{filter:brightness(1.14)}
html.dark #toast{background:#2e2c29}
/* ===== 今日新闻速递 ===== */
.news-meta{display:none}
.sheet-sub{display:none}

.news-item:last-child{border-bottom:none}

.news-tag{flex:none;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:7px;padding:2px 8px;margin-top:2px;white-space:nowrap}
.news-txt{flex:1;min-width:0}
.news-t{font-size:13.5px;font-weight:600;line-height:1.45}
.news-m{font-size:12px;color:var(--sub);margin-top:4px;display:flex;gap:10px}
.news-more{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:700;color:var(--accent);padding:10px 0 2px;cursor:pointer;border-top:1px dashed var(--line)}
.news-arrow{font-size:16px;line-height:1}
/* 底部弹层 */
.sheet-mask{position:fixed;inset:0;background:rgba(20,19,17,.45);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet-mask[hidden]{display:none}
body.lock-scroll{overflow:hidden}
html.dark .sheet-mask{background:rgba(0,0,0,.62)}
.news-sheet{width:100%;max-width:600px;background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;max-height:85vh;display:flex;flex-direction:column;animation:slideup .26s cubic-bezier(.2,.9,.3,1.05);box-shadow:0 -20px 60px -20px rgba(0,0,0,.35)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet-bar{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 2px;flex:none}
.sheet-head{display:flex;align-items:center;padding:8px 20px 0}

.cat-btn{flex:none;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:13px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;white-space:nowrap}

function pad(n){return n<10?"0"+n:""+n}
function fmtDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fmtTime(ts){ const d = new Date(ts); return pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }
function parseWeekRanges(s){
  const set = new Set();
  s.split(",").forEach(seg=>{
    const m = seg.trim().match(/^(\d+)(?:-(\d+))?$/);
    if(!m) return;
    const a = +m[1], b = m[2]?+m[2]:a;
    for(let w=a; w<=b; w++) set.add(w);
  });
  return set;
}
function inWeek(c, w){ return parseWeekRanges(c.weeks).has(w) }
function dateOfWeekday(week, weekday){ return new Date(ANCHOR.getTime() + ((week-1)*7 + (weekday-1)) * 86400000); }
function currentWeekWeekday(){
  const now = new Date();
  const diff = Math.floor((now - ANCHOR)/86400000);
  let w = Math.floor(diff/7)+1;
  if(w<1) w=1; if(w>TOTAL_WEEKS) w=TOTAL_WEEKS;
  const d = now.getDay();
  return {week:w, weekday: d===0?7:d};
}

function addChip(text){ text = String(text||"").trim(); if(!text) return; const a = chips().filter(function(x){ return x!==text; }); a.unshift(text); writeChips(a.slice(0,24)); }
function delChip(text){ writeChips(chips().filter(function(x){ return x!==text; })); }
function renameChip(oldT, newT){ newT = String(newT||"").trim(); if(!newT) return; const out = []; chips().forEach(function(x){ const v = (x===oldT ? newT : x); if(out.indexOf(v)<0) out.push(v); }); writeChips(out); }
function readPlan(){ try{ const o = JSON.parse(localStorage.getItem(PLAN_KEY) || "{}"); return (o && typeof o==="object") ? o : {}; }catch(e){ return {}; } }

function todayKey(){ return fmtDate(new Date()); }

const REP_KEY = "planRepeatV1";
function readRep(){ try{ const a = JSON.parse(localStorage.getItem(REP_KEY)||"[]"); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function writeRep(a){ try{ localStorage.setItem(REP_KEY, JSON.stringify(a)); }catch(e){} }
function weekdayNum(){ const d = new Date().getDay(); return d === 0 ? 7 : d; }
function repRule(id){ const a = readRep().filter(function(r){ return r && r.id === id; }); return a.length ? a[0] : null; }
/* 记忆功能：某天第一次打开时，把「每周/每天重复」的计划自动填进当天，之后这天归你手动管 */
function seedRepeat(){
const o = readPlan(); const k = todayKey();
if(Array.isArray(o[k])) return o[k];
const wd = weekdayNum();
const rules = readRep().filter(function(r){ return r && r.text && (r.mode === "d" || r.wd === wd); });
if(!rules.length) return [];
const list = rules.map(function(r){ return {id:"rp-"+r.id+"-"+k, slot:r.slot||"", text:r.text, done:false, rep:r.id}; });
o[k] = list; writePlan(o);
return list;
}
function toggleRep(btn){
const id = btn.closest(".plan-item").dataset.pid;
const a = dayPlan();
const it = a.filter(function(x){ return x.id===id; })[0];
if(!it) return;
const rules = readRep();
const cur = rules.filter(function(r){ return r.id===it.rep; })[0] || null;
if(!cur){
const rid = "r" + Date.now() + Math.random().toString(36).slice(2,6);
rules.push({id:rid, text:it.text, slot:it.slot||"", wd:weekdayNum(), mode:"w"});
it.rep = rid; writeRep(rules); setDayPlan(a); renderToday();
toast("已记住：以后每周" + WEEKDAYS[weekdayNum()-1].slice(1) + "都会自动出现");
return;
}
if(cur.mode === "w"){
cur.mode = "d"; writeRep(rules); setDayPlan(a); renderToday();
toast("已改成每天重复"); return;
}
it.rep = ""; writeRep(rules.filter(function(r){ return r.id!==cur.id; }));
setDayPlan(a); renderToday();
toast("已取消重复");
}
function setDayPlan(a){ const o=readPlan(); o[todayKey()]=a; writePlan(o); }
function hm2m(t){ const p=String(t||"0:0").split(":"); return (+p[0]||0)*60+(+p[1]||0); }
function m2hm(m){ m=Math.max(0,Math.round(m)); return pad(Math.floor(m/60))+":"+pad(m%60); }
function durTxt(m){ const h=Math.floor(m/60), r=m%60; return (h?h+"小时":"")+(r?r+"分":"") || "0分"; }
function esc2(x){ return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function nowMin(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function leftTxt(m){
  m = Math.max(0, Math.round(m));
  const h = Math.floor(m/60), r = m%60;
  if(h && r) return h+" 小时 "+r+" 分";
  if(h) return h+" 小时";
  return r+" 分";
}
/* 下节课提醒：开课前 25 分钟内出现，写清教室 / 时间 / 老师 / 还剩多久，颜色用这门课的颜色 */
const NEXT_WARN = 25;
function nextTipHtml(nx, left){
  if(!nx || left < 0 || left > NEXT_WARN) return "";
  /* 语气跟着剩余时间走，越近越催；语气并进倒计时胶囊，教师单独一行不截断 */
  const tone = left <= 5 ? "快跑" : left <= 10 ? "该动身了"
    : left <= 18 ? "收拾一下" : "不慌";
  const whenTxt = left <= 0 ? "马上开课" : ("还有 " + left + " 分钟");
  return '<span class="nt-ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none">'
   + '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2"/>'
   + '<path d="M12 7.4v5l3.2 2" stroke="currentColor" stroke-width="2.2" '
   + 'stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
   + '<span class="nt-body">'
   + '<span class="nt-when">' + whenTxt + ' · ' + tone + '</span>'
   + '<span class="nt-room">' + nx.start + ' · ' + esc2(nx.loc) + '</span>'
   + '<span class="nt-sub">' + esc2(nx.teacher) + '</span>'
   + '</span>';
}

function renderNextTip(list){
  const tip = document.getElementById("nextTip");
  if(!tip) return;
  const n = nowMin();
  const nx = (list || []).filter(function(c){ return hm2m(c.start) > n; })
    .sort(function(a,b){ return hm2m(a.start) - hm2m(b.start); })[0];
  const html = nextTipHtml(nx, nx ? hm2m(nx.start) - n : -1);
  if(!html){ tip.hidden = true; tip.innerHTML = ""; return; }
  tip.style.setProperty("--nt", colorOf(nx));
  tip.innerHTML = html;
  tip.hidden = false;
}
function nowLineHtml(){ return '<div class="now-line"><span class="now-dot"></span><span class="now-txt">现在 '+m2hm(nowMin())+'</span><span class="now-rule"></span></div>'; }

  return '<div class="t-item'+(isNow?' is-now':'')+'"><span class="t-flag" style="background:'+colorOf(c)+'"></span>'

   + (isNow ? '<div class="now-badge"><i></i>上课中 · 还剩 '+leftTxt(hm2m(c.end)-nowMin())+'</div>'
            : '<div class="slot">'+c.start+' 开始</div>')
   + '</div>'
   + '<div class="t-body"><div class="t-loc">'+esc2(c.loc)+'</div><div class="t-name">'+esc2(c.name)+'</div>'
   + '<div class="t-line">'+esc2(c.teacher)+' · '+c.weeks+'周</div></div></div>';

function progressHtml(plans){
  const total = plans.length, done = plans.filter(function(p){ return p.done; }).length;
  const pct = total ? Math.round(done/total*100) : 0;
  return '<div class="plan-prog"><span class="plan-prog-txt">今日计划 <b>'+done+'</b>/'+total+'</span><span class="plan-bar"><i style="width:'+pct+'%"></i></span></div>';
}

function planItemHtml(p){
const rr = p.rep ? repRule(p.rep) : null;
return '<div class="plan-item'+(p.done?' done':'')+'" data-pid="'+p.id+'">'
+ '<span class="plan-text">'+esc2(p.text)+(rr? '<span class="plan-replab">'+(rr.mode==="d"?"每天":"每周")+'</span>' : '')+'</span>'
+ '<button class="plan-rep'+(p.rep?' on':'')+'" data-act="rep" aria-label="重复">↻</button>'

function slotStartOf(p){ if(!p.slot) return -1; return hm2m(String(p.slot).split("-")[0]); }
function inGapRange(p, g){ const s = slotStartOf(p); return s >= 0 && s >= g.start && s < g.end; }
/* 空档提示语：按时段和时长换着说，同一天同一格稳定不跳字 */
function gapTip(start, len){
const h = start/60;
let pool;
if(len >= 120) pool = ["整块时间别浪费","来做点正事吧","今天自律了吗","这俩小时很值钱"];
else if(h < 12) pool = ["来做点什么吧","今天自律了吗","这时候脑子最清醒","开个好头"];
else if(h < 17) pool = ["下午别打瞌睡","来做点什么吧","今天自律了吗","起来动两下"];
else if(h < 19) pool = ["去动一动吧","今天运动了吗","趁天还亮","出去走走"];
else pool = ["今天收个尾吧","今天自律了吗","做点安静的","睡前别刷太久"];
const i = (new Date().getDate()*7 + Math.round(start/30)*3 + Math.round(len/15)) % pool.length;
return pool[i];
}
function gapHtml(g, plans, isNow){
const mine = plans || [];
return '<div class="today-gap'+(isNow?' is-now':'')+'"><div class="gap-row"><span class="gap-badge">空档</span>'
 + '<span class="gap-time">'+m2hm(g.start)+' – '+m2hm(g.end)+'</span>'
 + (isNow ? "" : '<span class="gap-len">'+durTxt(g.end-g.start)+'</span>')
 + (isNow ? '<span class="gap-tip">还剩 '+leftTxt(g.end-nowMin())+'</span>'
          : '<span class="gap-tip">'+esc2(gapTip(g.start, g.end-g.start))+'</span>')
 + '<button class="gap-add" data-act="add" data-slot="'+g.slot+'" data-label="'+m2hm(g.start)+' – '+m2hm(g.end)+'">＋ 计划</button></div>'
 + (mine.length? '<div class="plan-list gap-list">'+mine.map(planItemHtml).join("")+'</div>' : "")
 + '</div>';
}

  return '<div class="plan-addrow"><button class="plan-addbtn" data-act="openadd">＋ 添加计划</button></div>';

function planBlockHtml(plans, noClass, rest){
const mine = rest || plans.filter(function(p){ return !p.slot; });
return (noClass ? '<div class="plan-head">今日无课 · 今天怎么过</div>' : '')
+ (plans.length? progressHtml(plans) : "")
+ (mine.length

: "");

function renderToday(){
const {week, weekday} = currentWeekWeekday();
const mt = document.getElementById("todayMeta");
mt.textContent = "第 "+week+" 周";
const list = courses.filter(c=>c.weekday===weekday && inWeek(c, week)).sort((a,b)=>a.start.localeCompare(b.start));
/* 一整天没课：把「今日课程」标题和第 N 周徽标一起收起来 */
const noClass = !list.length;
const h2 = document.querySelector("#todayCard h2");
if(h2) h2.style.display = noClass ? "none" : "";
mt.style.display = noClass ? "none" : "";
const box = document.getElementById("todayList");
const plans = dayPlan();
if(!list.length){ box.innerHTML = planBlockHtml(plans, true, plans) + addRowHtml(); renderNextTip([]); return; }
/* ——空档规则：只在两节课之间的空当给计划位——
   上课前那段不算（9 点上课，8 点的空当没意义）
   11:30–14:00 是吃饭午休，直接挖掉
   晚上封顶 21:00，少于 45 分钟不算 */
const DAY_START = 9*60, DAY_END = 21*60, REST_A = 11*60+30, REST_B = 14*60, MIN_GAP = 45;
const freeSegs = function(a, b){
a = Math.max(a, DAY_START); b = Math.min(b, DAY_END);
if(b - a <= 0) return [];
const out = [];
if(a < REST_A) out.push([a, Math.min(b, REST_A)]);
if(b > REST_B) out.push([Math.max(a, REST_B), b]);
return out;
};
const items = [];
let cursor = null;
list.forEach(c=>{
const st = hm2m(c.start), en = hm2m(c.end);
if(cursor !== null){
freeSegs(cursor, st).forEach(function(sg){
if(sg[1]-sg[0] >= MIN_GAP) items.push({type:"gap", start:sg[0], end:sg[1], slot:m2hm(sg[0])+"-"+m2hm(sg[1])});
});
}
items.push({type:"course", c});
cursor = cursor === null ? en : Math.max(cursor, en);
});
freeSegs(cursor, DAY_END).forEach(function(sg){
if(sg[1]-sg[0] >= MIN_GAP) items.push({type:"gap", start:sg[0], end:sg[1], slot:m2hm(sg[0])+"-"+m2hm(sg[1])});
});
const gaps = items.filter(function(it){ return it.type==="gap"; });
const inAnyGap = function(p){ return gaps.some(function(g){ return inGapRange(p, g); }); };
const rest = plans.filter(function(p){ return !p.slot || !inAnyGap(p); });
/* 现在时间线：找出「正在进行的这一段」和「时间线该插在谁前面」 */
const nMin = nowMin();
const spanOf = function(it){ return it.type==="course" ? [hm2m(it.c.start), hm2m(it.c.end)] : [it.start, it.end]; };
let liveIdx = -1;
for(let i=0;i<items.length;i++){ const sp = spanOf(items[i]); if(nMin >= sp[0] && nMin < sp[1]){ liveIdx = i; break; } }
let lineAt = -1;
for(let i=0;i<items.length;i++){ if(nMin < spanOf(items[i])[0]){ lineAt = i; break; } }
if(lineAt < 0) lineAt = items.length;
if(liveIdx >= 0) lineAt = liveIdx;
box.innerHTML = planBlockHtml(plans, false, rest)
+ items.map(function(it, i){
return (i===lineAt ? nowLineHtml() : "")
+ (it.type==="course" ? courseHtml(it.c, i===liveIdx)
: gapHtml(it, plans.filter(function(p){ return inGapRange(p, it); }), i===liveIdx));
}).join("")
+ (lineAt === items.length ? nowLineHtml() : "")
+ addRowHtml();
renderNextTip(list);
}

function celebrate(rect){
  const cols = ["#ff5a62","#21d68e","#f0a13c","#7c9bff","#ffd166","#c15f3c"];
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  for(let i=0;i<14;i++){
    const el = document.createElement("span");
    el.className = "confetti";
    const ang = Math.random()*Math.PI*2, dist = 22 + Math.random()*36;
    el.style.left = cx + "px"; el.style.top = cy + "px";
    el.style.background = cols[i % cols.length];
    el.style.setProperty("--dx", (Math.cos(ang)*dist).toFixed(1)+"px");
    el.style.setProperty("--dy", (Math.sin(ang)*dist).toFixed(1)+"px");
    document.body.appendChild(el);
    (function(x){ setTimeout(function(){ try{ x.remove(); }catch(e){} }, 900); })(el);
  }
  try{ if(navigator.vibrate) navigator.vibrate(18); }catch(e){}
}

function openInlineAdd(btn){
  const slot = btn.dataset.slot || "";
  const wrap = document.createElement("div");
  wrap.className = "plan-edit";
  wrap.innerHTML = '<div class="plan-edit-row"><input type="text" placeholder="写点什么…" maxlength="40"><button class="plan-ok" data-commit="1">✓</button></div>'
    + (chips().length ? '<div class="plan-chips">'+chips().map(function(x){ return '<button class="plan-chip xsmall" data-pick="'+esc2(x)+'">'+esc2(x)+'</button>'; }).join("")+'</div>' : "");
  btn.replaceWith(wrap);
  const inp = wrap.querySelector("input"); inp.focus();
  const commit = function(){ const v = inp.value.trim(); if(v) addPlan(slot, v); else renderToday(); };
  wrap.querySelector("[data-commit]").addEventListener("click", commit);
  inp.addEventListener("keydown", function(ev){ if(ev.key==="Enter") commit(); if(ev.key==="Escape") renderToday(); });
  wrap.querySelectorAll("[data-pick]").forEach(function(c){ c.addEventListener("click", function(){ addPlan(slot, c.getAttribute("data-pick")); }); });

function onPlanClick(e){
  const b = e.target.closest("button"); if(!b) return;
  const act = b.dataset.act;
  if(act==="del"){ const id=b.closest(".plan-item").dataset.pid; setDayPlan(dayPlan().filter(function(x){ return x.id!==id; })); renderToday(); return; }
if(act==="rep"){ toggleRep(b); return; }
  if(act==="toggle"){
    const id = b.closest(".plan-item").dataset.pid;
    const a = dayPlan(); let nowDone = false;
    a.forEach(function(x){ if(x.id===id){ x.done = !x.done; nowDone = x.done; } });
    setDayPlan(a);
    const rect = b.getBoundingClientRect();
    renderToday();
    if(nowDone){
      const nb = document.querySelector('.plan-item[data-pid="'+id+'"] .plan-done');
      if(nb){ nb.classList.add("pop"); setTimeout(function(){ try{ nb.classList.remove("pop"); }catch(e){} }, 460); }
      celebrate(rect);
      const all = dayPlan();
      if(all.length && all.every(function(x){ return x.done; })) celebrateAll();
    }
    return;
  }
  if(act==="quick"){ addPlan("", b.dataset.text); return; }
  if(act==="add"){
    if(window.__addPanel && window.__addPanel.openSlot) window.__addPanel.openSlot(b.dataset.slot||"", b.dataset.label||"");
    else openInlineAdd(b);
    return;
  }
  if(act==="editchips"){ planEditMode = !planEditMode; renderToday(); return; }
  if(act==="delchip"){ delChip(b.dataset.text); renderToday(); return; }
  if(act==="renchip"){ openChipRename(b); return; }
  if(act==="newchip"){ openChipNew(b); return; }
}

function renderWeekGrid(week){
  const grid = document.getElementById("weekGrid");
  const {week: curWeek, weekday: todayWd} = currentWeekWeekday();
  const isCur = week === curWeek;
  let html = "";
  for(let wd=1; wd<=7; wd++){
    const items = courses.filter(c=>c.weekday===wd && inWeek(c, week)).sort((a,b)=>a.start.localeCompare(b.start));
    html += `<div class="wday${isCur && wd===todayWd ? ' today':''}">
      <div class="wday-head"><span>${WEEKDAYS[wd-1]}</span><span>${fmtDate(dateOfWeekday(week,wd)).slice(5)}</span></div>
      ${items.length? items.map(c=>`
        <div class="witem" style="background:${colorOf(c)}">
          <div class="n">${c.start}-${c.end}</div>
          <div>${c.name}</div>
          <div class="d">${c.loc}</div>
        </div>`).join("") : '<div class="empty" style="font-size:12px">—</div>'}
    </div>`;
  }
  grid.innerHTML = html;
  // 仅本周：把"今天"一列滚到容器中间；其他周滚回周一
  requestAnimationFrame(()=>{
    const scroller = grid.parentElement;
    if(!scroller) return;
    if(isCur){
      const tc = grid.querySelector(".wday.today");
      if(tc){
        const tcRect = tc.getBoundingClientRect();
        const scRect = scroller.getBoundingClientRect();
        const target = tcRect.left - scRect.left + scroller.scrollLeft - (scroller.clientWidth - tcRect.width) / 2;
        scroller.scrollLeft = Math.max(0, target);
      }
    } else {
      scroller.scrollLeft = 0;
    }
  });
}

}

function dayOfYear(d){
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}
function renderQuote(){
  const d = new Date();
  document.getElementById("qLabel").textContent = "每日一句 · " + fmtDate(d) + " " + (d.getDay()===0?"周日":WEEKDAYS[d.getDay()-1]);
  loadDailyQuote(d);
}
function loadDailyQuote(d){
  const en = document.getElementById("qText");
  const src = document.getElementById("qSrc");
  const showLocal = ()=>{
    const q = QUOTES[dayOfYear(d) % QUOTES.length];
    en.textContent = "\u201C" + q.en + "\u201D";
    src.textContent = "— " + q.src;
    src.style.display = "";
    fitQuote();
  };
  // 优先联网：爱词霸每日一句（JSONP，sid 每日递增，不重复；无出处则不显示来源）
  const cbName = "__iciba" + Date.now();
  const cleanup = ()=>{ try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; } };
  window[cbName] = (j)=>{
    try{
      if(j && j.content){
        en.textContent = "\u201C" + j.content + "\u201D";
        src.textContent = "";
        src.style.display = "none";
        fitQuote();
      } else { showLocal(); }
    }catch(e){ showLocal(); }
    cleanup();
  };
  const s = document.createElement("script");
  s.src = "https://open.iciba.com/dsapi/?callback=" + cbName;
  s.onerror = ()=>{ showLocal(); cleanup(); };
  setTimeout(()=>{ if(window[cbName]){ window[cbName](null); } }, 6000);
  document.head.appendChild(s);
}
function fitQuote(){
  const el = document.getElementById("qText");
  if(!el) return;
  el.style.fontSize = "";
  const base = parseFloat(getComputedStyle(el).fontSize);
  if(!base) return;
  el.style.fontSize = base + "px";
  let fs = base, guard = 0;
  while(el.clientHeight > 2.4*fs + 1 && fs > 18 && guard++ < 80){
    fs -= 1;
    el.style.fontSize = fs + "px";
  }
}
function applyTheme(){
  const h = new Date().getHours();
  document.documentElement.classList.toggle("dark", h >= 22 || h < 7);
}

/* ---- 网络工具 ---- */
async function fetchBuf(url, ms){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms || 5000);
  try{
    const res = await fetch(url, {signal: ctrl.signal});
    if(!res.ok) throw new Error("HTTP "+res.status);
    return await res.arrayBuffer();
  } finally { clearTimeout(t); }
}
async function fetchGBK(url){ return new TextDecoder("gbk").decode(await fetchBuf(url)); }
async function fetchJSON(url){ return JSON.parse(new TextDecoder("utf-8").decode(await fetchBuf(url))); }
/* 东财 JSONP（绕过 CORS，script 标签加载，参照新闻 JSONP 模式） */
let __emcbSeq = 0;
function fetchEMJSONP(url, ms){
  return new Promise((resolve)=>{
    const cb = "__emcb" + (++__emcbSeq);
    const u = url + (url.indexOf("?") >= 0 ? "&" : "?") + "cb=" + cb;
    const cleanup = ()=>{ clearTimeout(timer); try{ delete window[cb]; }catch(e){} s.remove(); };
    const timer = setTimeout(()=>{ cleanup(); resolve(null); }, ms || 6000);
    window[cb] = (d)=>{ cleanup(); resolve(d); };
    const s = document.createElement("script");
    s.referrerPolicy = "no-referrer";
    s.src = u;
    s.onerror = ()=>{ cleanup(); resolve(null); };
    document.head.appendChild(s);
  });
}

/* 东财 push2his：部分网络（含本机）整段不可达，连 curl 都连不上。
   失败一次后 30 分钟内不再尝试，否则每次点开股票都要白等一轮超时。 */
function emIsDead(){
  try{ return Number(localStorage.getItem("emDead") || 0) > Date.now(); }catch(e){ return false; }
}
function emMarkDead(){
  try{ localStorage.setItem("emDead", String(Date.now() + 30*60*1000)); }catch(e){}
}

function parseQt(text){
  const out = {};
  const re = /v_([A-Za-z0-9]+)="([^"]*)"/g;
  let m;
  while((m = re.exec(text))){
    const f = m[2].split("~");
    if(f.length < 34 || !f[3]) continue;
    const chg = +f[31], pct = +f[32];
    out[m[1]] = {
      name: f[1], code: f[2], price: +f[3], prev: +f[4], open: +f[5],
      high: +f[33], low: +f[34], vol: +f[6], amount: +f[37],
      mcap: +f[45], time: f[30],
      chg: isFinite(chg)?chg:0, pct: isFinite(pct)?pct:0
    };
  }
  return out;
}

/* ---- 格式化 ---- */
function fmtPrice(v){ return (v==null||!isFinite(v))?"--":v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function signed(v){ return v>0?"+":"-"; }
function fmtPct(v){ return (v==null||!isFinite(v))?"--":(v>0?"+":"")+v.toFixed(2)+"%"; }
function fmtNum(v){
  if(v==null||!isFinite(v)||v===0) return "--";
  const a = Math.abs(v);
  if(a>=1e12) return (v/1e12).toFixed(2)+"万亿";
  if(a>=1e8) return (v/1e8).toFixed(2)+"亿";
  if(a>=1e4) return (v/1e4).toFixed(2)+"万";
  return String(Math.round(v));
}

async function withRetry(fn, tries, delay){
  let last;
  for(let i=0;i<tries;i++){
    try{ return await fn(); }catch(e){ last = e; }
    await new Promise(r=>setTimeout(r, delay));
  }
  throw last;
}

/* 分时加载：分时优先，失败自动降级近 5 日日K（带重试）
   memoized：同一标的的多次渲染请求复用同一个加载任务，数据就绪后各自渲染 */
function loadMinute(item){
  if(item.pts || (item.kp && item.kp[5])) return Promise.resolve(item);
  if(item._p) return item._p;
  item._p = (async()=>{
    try{
      if(item.em){
        /* 美股分时：优先腾讯 usMinute（一天 390+ 点、CORS 开放、与 A 股同格式），失败再退东财 */
        try{
          const ju = await withRetry(()=>fetchJSON(TX_USMIN + item.tx), 2, 400);
          const nu = ju && ju.data && ju.data[item.tx] && ju.data[item.tx].data;
          const au = nu && nu.data;
          if(au && au.length > 2 && String(au[0]).trim() !== "0"){
            item.pts = au.map(s=>{ const p = String(s).split(" "); return {t: p[0].slice(0,2)+":"+p[0].slice(2,4), v:+p[1]}; });
            item.ptDate = nu.date || "";
            item.fb = "";
          }
        }catch(e){}
        if(!item.pts){

        try{
          const j = await withRetry(()=>fetchEMJSONP(EM_TREND + item.em + "&fields1=f1,f2,f3,f4,f5,f6,f7,f8,f9,f10,f11,f12,f13&fields2=f51,f52,f53,f54,f55,f56,f57,f58&ndays=1&iscr=0", 4000), 1, 0);
          const arr = j && j.data && j.data.trends;
          if(arr && arr.length > 2){
            item.pts = arr.map(s=>{ const p = s.split(","); return {t:p[0].slice(11,16), v:+p[2]}; });
            item.ptDate = arr[0].split(",")[0].slice(0,10);
            item.fb = "";
          }
        }catch(e){}
      }} else {
        const j = await withRetry(()=>fetchJSON(TX_MIN + item.tx), 3, 500);
        const node = j && j.data && j.data[item.tx] && j.data[item.tx].data;
        const arr = node && node.data;
        if(arr && arr.length && arr[0] && arr[0].trim() !== "0"){
          item.pts = arr.map(s=>{ const p = s.split(" "); return {t: p[0].slice(0,2)+":"+p[0].slice(2,4), v:+p[1]}; });
          item.ptDate = node.date || "";
          item.fb = "";
        }
      }
    }catch(e){}
    if(!item.pts){
      try{
        const n = await withRetry(()=>loadK(item, 5), 3, 500);
        item.fb = n > 0 ? "近5日" : "";
      }catch(e){ item.fb = ""; }
    }
    return item;
  })();
  return item._p;
}

async function loadK(item, n, ytd){
  // 东财 klines 每项是 "日期,开,收,高,低,..." 逗号分隔字符串；兼容嵌套数组
  const clean = kl => kl.map(r=>{
    const p = Array.isArray(r) ? r : String(r).split(",");
    return {t: String(p[0]).slice(5), v:+p[2], h:+p[3], l:+p[4]};
  }).filter(x=>isFinite(x.v) && x.v > 0);
  // 美股/指数日K：优先腾讯 usfqkline（体积小、CORS 开放、全部标的可用），失败再退东财 kline
  if(item.em){
    try{
      const usSym = (item.q && item.q.code) ? ("us" + item.q.code) : item.tx;
      const j = await fetchJSON(TX_USFQ + usSym + ",day,,," + (ytd ? 400 : Math.max(n, 5)) + ",qfq");
      const node = j && j.data && j.data[usSym];
      const tkl = node ? (node.qfqday || node.day || []) : [];
      if(tkl && tkl.length){
        item.kp = item.kp || {};
        if(ytd){
          const year = String(new Date().getFullYear());
          const yk = tkl.filter(s=>String(Array.isArray(s)?s[0]:String(s).split(",")[0]).startsWith(year + "-"));
          item.kp.ytd = clean(yk.length ? yk : tkl);
          return item.kp.ytd.length;
        }
        const sl = tkl.length > n ? tkl.slice(tkl.length - n) : tkl;
        item.kp[n] = clean(sl);
        return item.kp[n].length;
      }
    }catch(e){}
    const lmt = ytd ? 400 : n;
    const j = await fetchEMJSONP("https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=" + item.em
      + "&klt=101&fqt=1&beg=0&end=20500101&lmt=" + lmt
      + "&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61");
    const klines = (j && j.data && j.data.klines) || [];
    if(klines && klines.length){
      item.kp = item.kp || {};
      if(ytd){
        const year = String(new Date().getFullYear());
        const yk = klines.filter(s=>s.startsWith(year + "-"));
        item.kp.ytd = clean(yk.length ? yk : klines);
        return item.kp.ytd.length;
      }
      const kl = klines.length > n ? klines.slice(klines.length - n) : klines;
      item.kp[n] = clean(kl);
      return item.kp[n].length;
    }
    return 0;
  }
  if(ytd){
    const year = new Date().getFullYear();
    const j = await fetchJSON(TX_K + item.tx + ",day," + year + "-01-01," + year + "-12-31,400,qfq");
    const node = j && j.data && j.data[item.tx];
    const kl = node ? (node.qfqday || node.day || []) : [];
    item.kp = item.kp || {};
    item.kp.ytd = clean(kl);
    return item.kp.ytd.length;
  }
  const j = await fetchJSON(TX_K + item.tx + ",day,,," + n + ",qfq");
  const node = j && j.data && j.data[item.tx];
  const kl0 = node ? (node.qfqday || node.day || []) : [];
  // 腾讯对美股会忽略数量参数返回全量：前端截取最近 n 根
  const kl = kl0.length > n ? kl0.slice(kl0.length - n) : kl0;
  item.kp = item.kp || {};
  item.kp[n] = clean(kl);
  return item.kp[n].length;
}

/* ---- SVG 迷你图：分时 + 虚线基准（Apple 风格） ---- */
let sparkUid = 0;
function thin(arr, max){
  if(arr.length <= max) return arr;
  const step = (arr.length-1)/(max-1);
  const out = [];
  for(let i=0;i<max;i++) out.push(arr[Math.round(i*step)]);
  return out;
}
function sparkSVG(item, color, w, h){
  const tc = themeColors();
  let pts = item.pts || (item.kp && (item.kp[5] || item.kp["1mo"])) || [];
  pts = thin(pts, 130).filter(p=>p && isFinite(p.v));
  if(pts.length < 2){
    // 统一兜底：昨收 → 现价 直线（涨跌颜色正确），不再使用新浪图片，保证所有迷你图都是 SVG
    const q = item.q;
    if(q && isFinite(q.prev) && q.prev > 0 && isFinite(q.price) && q.price > 0){
      pts = [{t:"", v:q.prev}, {t:"", v:q.price}];
    }
  }
  if(pts.length < 2){
    return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'"><text x="'+(w/2)+'" y="'+(h/2+4)+'" text-anchor="middle" font-size="10" fill="'+tc.axis+'">暂无数据</text></svg>';
  }
  const vals = pts.map(p=>p.v);
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  const pad = Math.max((max-min)*0.06, (max===0?1:max)*0.0008);
  min -= pad; max += pad;
  const span = (max-min) || 1;
  const n = pts.length;
  const padX = 5, padY = 5;
  const px = i => padX + i/(n-1)*(w-2*padX);
  const py = v => padY + (1-(v-min)/span)*(h-2*padY);
  const line = pts.map((p,i)=>px(i).toFixed(1)+","+py(p.v).toFixed(1)).join(" ");
  const x0 = px(0), x1 = px(n-1), yb = h-padY/2;
  const area = pts.map((p,i)=>px(i).toFixed(1)+","+py(p.v).toFixed(1)).join(" L ") + " L " + x1.toFixed(1) + "," + yb.toFixed(1) + " L " + x0.toFixed(1) + "," + yb.toFixed(1) + " Z";
  const uid = "sp" + (++sparkUid);
  const last = pts[n-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'">'
    + '<defs><linearGradient id="'+uid+'" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="'+color+'" stop-opacity="0.28"/>'
    + '<stop offset="1" stop-color="'+color+'" stop-opacity="0"/>'
    + '</linearGradient></defs>'
    // 基准虚线：首点 → 末点（Apple 涨幅基准线）
    + '<line x1="'+x0.toFixed(1)+'" y1="'+py(pts[0].v).toFixed(1)+'" x2="'+x1.toFixed(1)+'" y2="'+py(last.v).toFixed(1)+'" stroke="'+tc.dash+'" stroke-width="1" stroke-dasharray="3 3" opacity="0.85"/>'
    + '<path d="M '+area+'" fill="url(#'+uid+')"/>'
    + '<polyline fill="none" stroke="'+color+'" stroke-width="3.5" opacity="0.14" stroke-linejoin="round" stroke-linecap="round" points="'+line+'"/>'
    + '<polyline fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" points="'+line+'"/>'
    + '<circle cx="'+x1.toFixed(1)+'" cy="'+py(last.v).toFixed(1)+'" r="2.6" fill="'+color+'" stroke="#fff" stroke-width="1.1"/>'
    + '</svg>';
}

/* ---- 渲染 ---- */
function itemOf(q, pool){
  const v = q[pool.tx];
  if(!v) return null;
  return {
    pool: pool, q: v, tx: pool.tx, em: pool.em, pts: null, kp: {}, fb: "", minuteLoading: false,
    isUp: v.pct > 0, isFlat: v.pct === 0
  };
}
function renderMarket(q, tag){
  const tc = themeColors();
  const meta = document.getElementById("mktMeta");
  const t = new Date(q._t || Date.now());
  meta.textContent = (tag ? tag + " · " : "") + "数据时间 " + t.getFullYear() + "-" + pad(t.getMonth()+1) + "-" + pad(t.getDate()) + " " + pad(t.getHours()) + ":" + pad(t.getMinutes());
  const box = document.getElementById("mktBox");

  const idxItems = INDICES.map(p=>itemOf(q, p)).filter(Boolean);
  const all = STOCKS.map(p=>itemOf(q, p)).filter(Boolean);
  idxItems.concat(all).forEach(it=>{ window.__items[it.pool.tx] = it; });
  const ups = all.filter(i=>i.isUp).sort((a,b)=>Math.abs(b.q.pct)-Math.abs(a.q.pct)).slice(0,20);
  const downs = all.filter(i=>!i.isUp).sort((a,b)=>Math.abs(b.q.pct)-Math.abs(a.q.pct)).slice(0,20);

  const rowHtml = (it) => {
    const c = it.q.pct >= 0 ? tc.up : tc.down;
    const priceTxt = isFinite(it.q.price) && it.q.price > 0 ? fmtPrice(it.q.price) : "--";
    return '<div class="mkt-row" data-tx="'+it.pool.tx+'">'
      + '<div class="mkt-info">'
      + '<div class="mkt-name">'+it.pool.name+'<span class="mkt-code">'+it.pool.tx.slice(2).toUpperCase()+'</span></div>'
      + '<div class="mkt-price" style="color:'+c+'">'+priceTxt+' <span class="mkt-chg">'+(it.q.chg>0?"+":"")+fmtPrice(it.q.chg)+' '+fmtPct(it.q.pct)+'</span></div>'
      + '<div class="mkt-tag">'+it.pool.tag+'</div>'
      + '</div>'
      + '<div class="mkt-chart" data-chart="'+it.pool.tx+'"></div>'
      + '</div>';
  };
  const chunk = (arr, n)=>{ const o=[]; for(let i=0;i<arr.length;i+=n) o.push(arr.slice(i,i+n)); return o; };
  const groupsHtml = (gs)=> gs.map(g=>'<div class="mkt-group">'+g.map(rowHtml).join("")+'</div>').join("");
  const upGroups = chunk(ups, 4), downGroups = chunk(downs, 4);

  box.innerHTML =
    '<div class="mkt-sec">大板块<span class="mkt-count">'+idxItems.length+'</span></div>'
    + '<div class="mkt-list">'+idxItems.map(rowHtml).join("")+'</div>'
    + (ups.length? '<div class="mkt-sec">上涨<span class="mkt-count up">'+ups.length+'</span></div>'
      + '<div class="mkt-scroll"><div class="mkt-track">'+groupsHtml(upGroups)+'</div></div>'
      : '<div class="mkt-sec">上涨<span class="mkt-count up">0</span></div><div class="empty">暂无上涨标的</div>')
    + (downs.length? '<div class="mkt-sec">下跌<span class="mkt-count down">'+downs.length+'</span></div>'
      + '<div class="mkt-scroll"><div class="mkt-track">'+groupsHtml(downGroups)+'</div></div>'
      : '<div class="mkt-sec">下跌<span class="mkt-count down">0</span></div><div class="empty">暂无下跌标的</div>');

  // 每屏一组 4 条：组宽度对齐滚动容器
  fitGroups();

  // 今日逻辑：领涨/领跌 × 最近 60 小时快讯 × 同板块联动（只写有依据的话）
  const logic = document.createElement("div");
  logic.className = "mkt-logic";
  logic.id = "mktLogic";
  box.appendChild(logic);
  logicState = {ups: ups, downs: downs, idx: idxItems, all: all};
  renderLogic();

  // 全量并发加载分时（并发 6），每支渲染迷你图
  loadAllCharts();
  bindClick();
}
function loadAllCharts(){
  const queue = [];
  let running = 0;
  const pump = ()=>{
    while(running < 6 && queue.length){
      const job = queue.shift();
      running++;
      Promise.resolve().then(job).finally(()=>{ running--; pump(); });
    }
  };
  const loadOne = (el)=>{
    if(!el || el.querySelector("svg")) return;
    const tx = el.getAttribute("data-chart");
    const it = window.__items && window.__items[tx];
    if(!it) return;
    queue.push(()=>loadMinute(it).then(()=>{
      const c = it.q.pct >= 0 ? themeColors().up : themeColors().down;
      el.innerHTML = sparkSVG(it, c, el.clientWidth || 132, el.clientHeight || 40);
    }).catch(()=>{}));
    pump();
  };
  // 首屏：指数 4 + 每条轨道第一组（4 条行卡片）立即加载
  const scrollers = document.querySelectorAll(".mkt-scroll");
  scrollers.forEach(sc=>{
    const cards = sc.querySelectorAll(".mkt-row");
    for(let i=0;i<Math.min(4, cards.length);i++) loadOne(cards[i].querySelector("[data-chart]"));
    // 横向滚动到附近时再加载其余行卡片
    sc.addEventListener("scroll", ()=>{
      const right = sc.scrollLeft + sc.clientWidth + 240;
      sc.querySelectorAll(".mkt-row").forEach(cd=>{

/* 1周视图：东方财富 5 日分时（A股约 1200 点、美股约 1950 点），比 5 根日K细得多 */
async function loadWeek(it){
  if(it.week && it.week.length) return it.week.length;
  const t = String(it.tx || "");
  /* A股 / 港股：腾讯 5 日分时（每天 240 个点） */
  if(t.indexOf("sh") === 0 || t.indexOf("sz") === 0 || t.indexOf("hk") === 0){
    try{
      const j = await withRetry(()=>fetchJSON(TX_DAY + t), 2, 400);
      const node = j && j.data && j.data[t] && j.data[t].data;
      if(Array.isArray(node) && node.length){
        const arr = [];
        node.forEach(function(day){
          const d = String(day && day.date || "");
          const lst = (day && day.data) || [];
          lst.forEach(function(s){
            const p = String(s).split(" ");
            const v = +p[1];
            if(isFinite(v) && v > 0){
              arr.push({t: d.slice(4,6) + "-" + d.slice(6,8) + " " + p[0].slice(0,2) + ":" + p[0].slice(2,4), v: v});
            }
          });
        });
        if(arr.length > 60){ it.week = arr; it.fbw = "5日分时"; return arr.length; }
      }
    }catch(e){}
  }
  /* 美股：东方财富 5 日分时（不可达时直接退 5 根日K，不再空等） */
  const sid = emIsDead() ? "" : secidOf(it);
  if(sid){
    try{
      const j = await withRetry(async function(){
        const r = await fetchEMJSONP(EM_TREND + sid + "&fields1=f1,f2,f3,f4&fields2=f51,f52,f53,f54&ndays=5&iscr=0", 5000);
        if(!r || !r.data) throw new Error("em-empty");
        return r;
      }, 2, 500);
      const arr = j && j.data && j.data.trends;
      if(arr && arr.length > 20){
        it.week = arr.map(s=>{ const p = String(s).split(","); return {t: p[0].slice(5,16), v: +p[2]}; })
                    .filter(x=>isFinite(x.v) && x.v > 0);
        it.fbw = "5日分时";
        return it.week.length;
      }
    }catch(e){ emMarkDead(); }
  }
  /* 美股：腾讯不给美股分钟K，但「最近一个交易日」的分时能拿到 →
     1 周拼成「前 4 天日K + 最后一天逐分钟」，末日是真实走势，不再是 5 根柱子 */
  if(t.indexOf("us") === 0){
    try{
      if(!it.kp || !it.kp[5]){ await loadK(it, 5); }
      const dk = (it.kp && it.kp[5]) || [];
      const jm = await withRetry(()=>fetchJSON(TX_USMIN + t), 2, 400);
      const node = jm && jm.data && jm.data[t] && jm.data[t].data;
      const arr = node && node.data;
      if(dk.length >= 4 && Array.isArray(arr) && arr.length > 30){
        const mins = arr.map(s=>{ const p = String(s).split(" "); return {v: +p[1]}; })
                       .filter(x=>isFinite(x.v) && x.v > 0);
        if(mins.length > 30){
          it.week = mixWeek(dk, mins);
          it.fbw = "近5日 · 末日分时";
          return it.week.length;
        }
      }
    }catch(e){}
  }
  /* 都失败：退回 5 根日K */
  if(!it.kp || !it.kp[5]){ try{ await loadK(it, 5); }catch(e){} }
  it.week = (it.kp && it.kp[5]) || [];
  it.fbw = "近5日 · 日K（美股无分钟源）";
  return it.week.length;
}

/* 日K + 末日分时拼成一条周线：日K点各占 1 份宽度，末日分钟点合起来也占 1 份，
   横轴才不会被末日撑满；点数压到 200 以内，保留日K点的高低影线 */
function mixWeek(daily, minutes){
  const days = daily.slice(0, Math.max(1, daily.length - 1));
  const last = daily[daily.length - 1] || {};
  const M = Math.max(120, 200 - days.length);
  const mins = thin(minutes, M);
  const per = 1 / mins.length;
  const pts = days.map(p=>({t:p.t, v:p.v, h:p.h, l:p.l, w:1}));
  mins.forEach((m, i)=>{ pts.push({t: (i === 0 || i === mins.length - 1) ? (last.t || "") : "", v:m.v, w:per}); });
  return pts;
}

function ymdAgo(days){
  const d = new Date(Date.now() - days*86400000);
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}
/* 细粒度K线（15/30 分钟）：A股走腾讯 mkline（实测直连、CORS 开放，最多 600 根）；
   港股/美股腾讯不提供分钟K → 退东财（被拦时 12h 熔断），都拿不到就由上层退日线 */
async function loadFine(item, klt, days){
  const key = "k" + klt;
  if(item.kq && item.kq[key]) return item.kq[key];
  const tx = String(item.tx || "");
  let pts = [];
  if(tx.indexOf("sh") === 0 || tx.indexOf("sz") === 0){
    try{
      const j = await withRetry(()=>fetchJSON(TX_MK + tx + ",m" + klt + ",,600"), 2, 400);
      const node = j && j.data && j.data[tx] && j.data[tx]["m" + klt];
      if(Array.isArray(node) && node.length >= 3){
        pts = node.map(function(r){
          const ts = String((r && r[0]) || "");
          return {
            d: ts.slice(0,4) + "-" + ts.slice(4,6) + "-" + ts.slice(6,8),
            t: ts.slice(4,6) + "-" + ts.slice(6,8),
            v: +r[2], h: +r[3], l: +r[4]
          };
        }).filter(function(x){ return isFinite(x.v) && x.v > 0; });
      }
    }catch(e){ pts = []; }
  }
  if(!pts.length && !emIsDead()){
    const sid = secidOf(item);
    if(sid){
      try{
        const j = await withRetry(async function(){
          const r = await fetchEMJSONP(EM_KLINE + sid + "&klt=" + klt + "&fqt=1&beg=0&end=20500101&lmt=1000"
            + "&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61", 6000);
          if(!r || !r.data) throw new Error("em-empty");
          return r;
        }, 2, 500);
        const kl = (j && j.data && j.data.klines) || [];
        pts = kl.map(function(r){
          const p = String(r).split(",");
          return {d: p[0].slice(0,10), t: p[0].slice(5,10), v:+p[2], h:+p[3], l:+p[4]};
        }).filter(function(x){ return isFinite(x.v) && x.v > 0; });
      }catch(e){ pts = []; emMarkDead(); }
    }
  }
  if(pts.length && days){
    const cut = ymdAgo(days);
    const win = pts.filter(function(p){ return p.d >= cut; });
    if(win.length >= 3) pts = win;
  }
  /* 失败的空结果不进缓存，下次点还能再试 */
  if(pts.length){ item.kq = item.kq || {}; item.kq[key] = pts; }
  return pts;
}

function bigSVG(pts, color, range, fb){
  pts = pts.filter(p=>p && isFinite(p.v));
  const useWick = pts.length > 3 && pts.length <= 200 && isFinite(pts[0].h) && isFinite(pts[0].l);
  pts = thin(pts, 200);
  const tc = themeColors();
  const w = 420, h = 236;
  const padL = 10, padR = 58, padT = 14, padB = 26;
  /* y-domain must include the wicks, otherwise highs/lows get clipped */
  let min = Infinity, max = -Infinity;
  pts.forEach(function(p){
    const lo = (useWick && isFinite(p.l) && p.l > 0) ? Math.min(p.v, p.l) : p.v;
    const hi = (useWick && isFinite(p.h) && p.h > 0) ? Math.max(p.v, p.h) : p.v;
    if(lo < min) min = lo;
    if(hi > max) max = hi;
  });
  const pad = Math.max((max-min)*0.05, 0.0001);
  min -= pad; max += pad;
  const span = (max-min) || 1;
  const n = pts.length;
  /* 横轴按权重铺开（默认每点等宽）：混了末日分时的那条线里，分钟点按比例分宽度 */
  let wsum = 0;
  pts.forEach(p=>{ wsum += (p && p.w) || 1; });
  const xs = []; let acc = 0;
  pts.forEach(p=>{ const ww = (p && p.w) || 1; xs.push(padL + (acc + ww/2)/wsum*(w-padL-padR)); acc += ww; });
  const px = i => xs[i];
  const py = v => padT + (1-(v-min)/span)*(h-padT-padB);
  const line = pts.map((p,i)=>px(i).toFixed(1)+","+py(p.v).toFixed(1)).join(" ");
  const uid = "big" + (++sparkUid);
  const yb = h-padB;
  const area = pts.map((p,i)=>px(i).toFixed(1)+","+py(p.v).toFixed(1)).join(" L ") + " L " + px(n-1).toFixed(1) + "," + yb.toFixed(1) + " L " + px(0).toFixed(1) + "," + yb.toFixed(1) + " Z";
  /* per-day high/low wicks so longer ranges have visible detail too */
  const wickHtml = useWick ? pts.map(function(p,i){
    if(!isFinite(p.h) || !isFinite(p.l) || p.h <= 0 || p.l <= 0) return "";
    const x = px(i).toFixed(1);
    return '<line x1="'+x+'" y1="'+py(p.h).toFixed(1)+'" x2="'+x+'" y2="'+py(p.l).toFixed(1)+'" stroke="'+color+'" stroke-width="1" opacity="0.3"/>';
  }).join("") : "";
  // Y axis: 4 ticks on the right
  const ticks = [];
  for(let i=0;i<=3;i++) ticks.push({v: min + span*i/3, x: w-padR+4, y: py(min + span*i/3)});
  const tickHtml = ticks.map(t=>'<text x="'+t.x+'" y="'+(t.y+3)+'" font-size="10" fill="'+tc.axis+'">'+fmtPrice(t.v)+'</text>').join("");
  // X axis: first / 1-3 / 2-3 / last
  /* 横轴只标有日期的点；稀疏序列（如 5 根日K）仍然只标首尾 */
  const labeled = []; pts.forEach((p,i)=>{ if(p && p.t) labeled.push(i); });
  let xi = [];
  if(labeled.length <= 6){
    xi = labeled.length ? [labeled[0], labeled[labeled.length-1]] : [];
  } else {
    [0, 1/3, 2/3, 1].forEach(function(f){
      const target = padL + f*(w-padL-padR);
      let best = labeled[0], bd = Infinity;
      labeled.forEach(function(i){ const d = Math.abs(px(i)-target); if(d < bd){ bd = d; best = i; } });
      if(xi.indexOf(best) < 0) xi.push(best);
    });
    xi.sort((a,b)=>a-b);
  }
  const spanX = (w-padL-padR) || 1;
  const xHtml = xi.map(i=>{
    const left = px(i)-padL, right = (w-padR)-px(i);
    const an = left < spanX*0.06 ? "start" : (right < spanX*0.06 ? "end" : "middle");
    return '<text x="'+px(i).toFixed(1)+'" y="'+(h-8)+'" text-anchor="'+an+'" font-size="10" fill="'+tc.axis+'">'+pts[i].t+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">'
    + '<defs><linearGradient id="'+uid+'" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="'+color+'" stop-opacity="0.22"/>'
    + '<stop offset="1" stop-color="'+color+'" stop-opacity="0"/>'
    + '</linearGradient></defs>'
    + '<path d="M '+area+'" fill="url(#'+uid+')"/>'
    + wickHtml
    + '<polyline fill="none" stroke="'+color+'" stroke-width="5" opacity="0.12" stroke-linejoin="round" stroke-linecap="round" points="'+line+'"/>'
    + '<polyline fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="'+line+'"/>'
    + '<circle cx="'+px(n-1).toFixed(1)+'" cy="'+py(pts[n-1].v).toFixed(1)+'" r="3.5" fill="'+color+'" stroke="#fff" stroke-width="1.4"/>'
    + tickHtml + xHtml
    + (fb ? '<text x="'+padL+'" y="12" text-anchor="start" font-size="10" fill="'+tc.axis+'">'+fb+'</text>' : "")
    + '</svg>';
}

function newsItemHtml(it, inSheet){
  const esc = s => String(s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  const tagTxt = it.tag ? '<span class="news-tag">'+esc(it.tag)+'</span>' : "";
  // 弹层列表只保留时间（用户要求）；主页预览保留时间+来源
  const m = inSheet
    ? '<div class="news-m"><span>' + esc((it.time || "").slice(5, 16)) + '</span></div>'
    : '<div class="news-m"><span>' + esc((it.time || "").slice(5, 16)) + '</span><span>新浪财经 7x24</span></div>';
  return '<div class="news-item" data-url="' + esc(it.url) + '" data-t="' + esc(it.t) + '" data-f="' + esc(it.full || "") + '">'
    + tagTxt
    + '<div class="news-txt">'
    + '<div class="news-t">' + esc(it.t) + '</div>'

function renderNews(){
  const list = newsStore;
  const now = new Date();
  document.getElementById("newsMeta").textContent = "数据时间 " + fmtDate(now) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + " ｜ 影响股市的大事";
  document.getElementById("newsPreview").innerHTML = newsOrder(list).slice(0, 5).map(i=>newsItemHtml(i, false)).join("");
  const catsEl = document.getElementById("newsCats");
  if(catsEl){
    catsEl.innerHTML = NEWS_CATS.map(function(p){
      const k=p[0], nm=p[1];
      const cnt = k==="all" ? list.length
        : (k==="pol" ? list.filter(function(i){ return isPol(i.t); }).length
        : list.filter(function(i){ return i.cat===k; }).length);
      return '<button class="cat-btn' + (newsCat===k?' on':'') + '" data-cat="' + k + '">' + nm + '<b>' + cnt + '</b></button>';
    }).join("");
  }
  const show = newsCat==="all" ? newsOrder(list)
    : (newsCat==="pol" ? newsOrder(list).filter(function(i){ return isPol(i.t); })
    : list.filter(function(i){ return i.cat===newsCat; }));
  document.getElementById("newsList").innerHTML = show.length ? show.map(i=>newsItemHtml(i, true)).join("") : '<div class="empty">该分类暂无内容</div>';
  /* 换分类（点标签或左右滑）：列表回到顶部，当前标签滚进可视范围 */
  if(renderNews.__cat !== newsCat){
    renderNews.__cat = newsCat;
    const nl = document.getElementById("newsList"); if(nl) nl.scrollTop = 0;
    if(catsEl){
      const onb = catsEl.querySelector(".cat-btn.on");
      if(onb) catsEl.scrollLeft = Math.max(0, onb.offsetLeft - (catsEl.clientWidth - onb.offsetWidth) / 2);
    }
  }
  document.getElementById("sheetMeta").textContent = "数据时间 " + fmtDate(now) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + " ｜ 点击条目打开原网站";
  document.querySelectorAll(".news-item").forEach(el=>{
    el.addEventListener("click", ()=>{
      openNewsReader(el.dataset.url || "", el.dataset.t || "", el.dataset.f || "");
    });
  });

function openNewsReader(url, title, full){
  if(!url) return;
  const sheet = document.querySelector(".news-sheet");
  if(window.innerWidth < 900){
    sheet.style.height = "85vh";
    sheet.style.maxHeight = "none";
  }
  document.getElementById("newsList").style.display = "none";
  document.getElementById("newsCats").style.display = "none";
  document.getElementById("newsReader").hidden = false;
  document.getElementById("readerTitle").textContent = title;
  document.getElementById("readerOpen").href = url;
  // 快讯有全文 → 纯文本阅读（无广告无导航）；否则内嵌原文页
  const textEl = document.getElementById("readerText");
  const frameEl = document.getElementById("readerFrame");
  if(full){
    frameEl.style.display = "none";
    textEl.hidden = false;
    textEl.innerHTML = "<div class=\"rt-full\">" + full.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") + "</div>";
  } else {
    textEl.hidden = true;
    frameEl.style.display = "";
    frameEl.src = url;
  }
}
function closeNewsReader(){
  const f = document.getElementById("readerFrame");
  f.src = "about:blank";
  const sheet = document.querySelector(".news-sheet");
  if(window.innerWidth < 900){
    sheet.style.height = "";
    sheet.style.maxHeight = "";
  }
  document.getElementById("newsReader").hidden = true;
  document.getElementById("newsList").style.display = "";
  document.getElementById("newsCats").style.display = "";
}
function fetchNews(){
  newsRendered = false;
  fetchSinaNews();
  fetchEMNews();
  fetchHotNews();
}
function fetchSinaNews(){
  const cbName = "sinaNews" + Date.now();
  const cleanup = ()=>{ try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; } };
  window[cbName] = (j)=>{
    try{
      const feed = (((j || {}).result || {}).data || {}).feed || {};
      const raw = feed.list || [];
      const items = raw.map(it=>{
        const t = stripHtml(it.rich_text || "");
        const tag = ((it.tag || [])[0] || {}).name || "快讯";
        const full = stripHtml(it.rich_text || "").replace(/^【[^】]*】/, "");
        return {t, tag, time: it.create_time || "", url: it.docurl || "", full};
      }).filter(i=>i.t && i.url)
        .map(i=>({...i, s: NEWS_HOT.reduce((n,k)=>i.t.includes(k)?n+1:n, 0) + NEWS_MIL.reduce((n,k)=>i.t.includes(k)?n+2:n, 0)}))
        .filter(i=>i.s >= 1)
        .sort((a,b)=>b.s - a.s || b.time.localeCompare(a.time))
        .slice(0, 40)
        .map(i=>({t:i.t, tag:i.tag, time:i.time, url:i.url, full:i.full, cat:"fin"}));
      if(items.length){
        newsRendered = true;
        addNews(items);
      }
    }catch(e){}
    cleanup();
  };
  const s = document.createElement("script");
  s.referrerPolicy = "no-referrer";
  s.src = NEWS_URL + cbName;
  s.onerror = cleanup;
  setTimeout(()=>{ if(window[cbName]){ cleanup(); } }, 5000);
  document.head.appendChild(s);
}
function fetchHotNews(){
  const chs = [["spo","2512","体育"],["ent","2513","娱乐"]];
  let pending = chs.length;
  const results = [];
  chs.forEach(pair=>{
    const catKey = pair[0], lid = pair[1], tagName = pair[2];
    const cbName = "sinaRoll" + lid + Date.now();
    const done = ()=>{
      if(--pending === 0){
        const seen = {}; const hot = [];
        results.forEach(i=>{ if(!seen[i.t]){ seen[i.t]=1; hot.push(i); } });
        // 军事/地缘内容加权排前
        hot.sort((a,b)=> String(b.time||"").localeCompare(String(a.time||"")));
        if(hot.length) addNews(hot);
      }
    };
    window[cbName] = (j)=>{
      try{
        const data = (((j || {}).result || {}).data) || [];
        data.forEach(it=>{
          const t = stripHtml(it.title || "");
          const full = stripHtml(it.intro || "");
          const url = (it.url || "").replace(/^http:/, "https:");
          if(t && url) results.push({
            t, tag: tagName, cat: catKey,
            time: fmtU(it.ctime), url, full,
            s: NEWS_HOT.reduce((n,k)=>t.includes(k)?n+1:n, 0) + NEWS_MIL.reduce((n,k)=>t.includes(k)?n+3:n, 0)
          });
        });
      }catch(e){}
      try{ delete window[cbName]; }catch(e){}
      done();
    };
    const s = document.createElement("script");
    s.referrerPolicy = "no-referrer";
    s.src = "https://feed.mix.sina.com.cn/api/roll/get?pageid=153&lid=" + lid + "&num=30&page=1&r=" + Math.random() + "&callback=" + cbName;
    s.onerror = ()=>{ try{ delete window[cbName]; }catch(e){} done(); };
    setTimeout(()=>{ if(window[cbName]){ try{ delete window[cbName]; }catch(e){} done(); } }, 5000);
    document.head.appendChild(s);
  });
}
function fmtU(ts){
  if(!ts) return "";
  try{
    const d = new Date(Number(ts) * 1000);
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }catch(e){ return ""; }
}
function addNews(items){
  if(!items || !items.length) return;
  const keyed = {};
  newsStore.forEach(i=>{ keyed[i.t] = i; });
  items.forEach(i=>{ if(!keyed[i.t]) keyed[i.t] = i; });
  const merged = Object.keys(keyed).map(k=>keyed[k]);
  merged.sort((a,b)=> String(b.time||"").localeCompare(String(a.time||"")));
  newsStore = merged.slice(0, 300);
  renderNews();
  writeNewsCache(newsStore);
  refreshLogic();
}

function newsClock(it){

  return s.length >= 16 ? s.slice(0, 16) : s.slice(0, 10);

function logicNewsPool(){
  var d = new Date(Date.now() - 60 * 3600 * 1000);
  var cut = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  return newsStore.filter(function(it){
    if(!it || !it.t || !it.url) return false;
    if(it.cat === "spo" || it.cat === "ent") return false;
    var c = newsClock(it);
    return c.length >= 16 ? c >= cut : true;
  });
}
